services:
  db:
    image: postgres:17-alpine
    container_name: primeerp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primeerp}
      POSTGRES_USER: ${POSTGRES_USER:-primeerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-primeerp_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primeerp} -d ${POSTGRES_DB:-primeerp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - primeerp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primeerp-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-PrimeERP}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-primeerp}:${POSTGRES_PASSWORD:-primeerp_change_me}@db:5432/${POSTGRES_DB:-primeerp}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "8001:8001"
    networks:
      - primeerp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: primeerp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - primeerp

volumes:
  postgres_data:

networks:
  primeerp:
    driver: bridge
