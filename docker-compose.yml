services:
  db:
    image: postgres:17-alpine
    container_name: primeerp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primeerp}
      POSTGRES_USER: ${POSTGRES_USER:-primeerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primeerp} -d ${POSTGRES_DB:-primeerp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - primeerp

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primeerp-migrate
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-primeerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-primeerp}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - primeerp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primeerp-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-PrimeERP}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-primeerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-primeerp}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      ETA_ENABLED: ${ETA_ENABLED:-false}
      ETA_IDENTITY_URL: ${ETA_IDENTITY_URL:-https://id.eta.gov.eg/connect/token}
      ETA_API_BASE_URL: ${ETA_API_BASE_URL:-https://api.invoicing.eta.gov.eg}
      ETA_API_VERSION: ${ETA_API_VERSION:-1}
      ETA_CLIENT_ID: ${ETA_CLIENT_ID:-}
      ETA_CLIENT_SECRET: ${ETA_CLIENT_SECRET:-}
      ETA_CLIENT_CERTIFICATE_PATH: ${ETA_CLIENT_CERTIFICATE_PATH:-}
      ETA_CLIENT_CERTIFICATE_PASSWORD: ${ETA_CLIENT_CERTIFICATE_PASSWORD:-}
      ETA_NOTIFICATION_SECRET: ${ETA_NOTIFICATION_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-https://graph.facebook.com/v22.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8001"
    networks:
      - primeerp

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    restart: "no"
    environment:
      APP_ENV: test
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-primeerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-primeerp}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-primeerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-primeerp}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - primeerp

  report-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primeerp-report-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-primeerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-primeerp}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-https://graph.facebook.com/v22.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      PRIMEERP_REPORT_WORKER_ID: ${PRIMEERP_REPORT_WORKER_ID:-report-worker}
      PRIMEERP_REPORT_WORKER_LEASE_SECONDS: ${PRIMEERP_REPORT_WORKER_LEASE_SECONDS:-300}
      PRIMEERP_REPORT_WORKER_POLL_SECONDS: ${PRIMEERP_REPORT_WORKER_POLL_SECONDS:-10}
      PRIMEERP_REPORT_MAX_ATTEMPTS: ${PRIMEERP_REPORT_MAX_ATTEMPTS:-5}
    command: ["python", "-m", "scripts.run_report_worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - primeerp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: primeerp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - primeerp

volumes:
  postgres_data:

networks:
  primeerp:
    driver: bridge
