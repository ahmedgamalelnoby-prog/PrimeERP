services:
  - type: web
    name: primeerp-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c "cd backend && alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: primeerp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: PrimeERP
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          name: primeerp-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna

  - type: web
    name: primeerp-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: primeerp-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: primeerp-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
