name: PrimeERP Hosted Validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

# Keep exactly one canonical hosted validation run per ref.
concurrency:
  group: primeerp-hosted-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend - hosted validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Validate modular architecture
        run: python scripts/check_modular_architecture.py
      - name: Validate API security boundaries
        run: python scripts/check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: python scripts/smoke_import.py
      - name: Validate production configuration safety
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: python scripts/check_production_config.py
      - name: Validate release architecture and API contract
        run: python scripts/check_release_readiness.py
      - name: Require a single Alembic head
        run: |
          python -m alembic heads > alembic-heads.txt
          cat alembic-heads.txt
          python -c "from pathlib import Path; n=sum('(head)' in x for x in Path('alembic-heads.txt').read_text().splitlines()); assert n == 1, f'Expected exactly one Alembic head; found {n}'"
      - name: Run unit and static tests
        run: python -m pytest -q

  frontend:
    name: Frontend - hosted validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  docker:
    name: Docker - hosted release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=primeerp_ci
          POSTGRES_USER=primeerp
          POSTGRES_PASSWORD=PrimeERP-CI-Only-Strong-Password-2026
          SECRET_KEY=PrimeERP-CI-Only-Secret-Key-2026-Change-Me
          CORS_ORIGINS=https://erp.example.com
          APP_ENV=production
          DEBUG=false
          ETA_ENABLED=false
          WHATSAPP_ENABLED=false
          EOF
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build production images
        run: docker compose build --pull migrate backend frontend
      - name: Start database and run migrations
        run: docker compose up -d db migrate
      - name: Wait for migration service
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}' primeerp-migrate 2>/dev/null || true)
            if [ "$status" = "exited" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' primeerp-migrate)
              if [ "$code" = "0" ]; then exit 0; fi
              docker compose logs migrate
              exit "$code"
            fi
            sleep 5
          done
          docker compose logs migrate
          exit 1
      - name: Execute PostgreSQL effective-date guard tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://primeerp:PrimeERP-CI-Only-Strong-Password-2026@db:5432/primeerp_ci
          DATABASE_URL: postgresql+psycopg://primeerp:PrimeERP-CI-Only-Strong-Password-2026@db:5432/primeerp_ci
          APP_ENV: test
          DEBUG: 'false'
          SECRET_KEY: PrimeERP-CI-Only-Secret-Key-2026-Change-Me
          CORS_ORIGINS: http://localhost:3000
        run: docker compose run --rm backend python -m pytest -q tests/jurisdiction/test_effective_date_db_guard.py
      - name: Start backend and frontend
        run: docker compose up -d backend frontend
      - name: Validate runtime health
        run: |
          for i in $(seq 1 60); do
            backend_status=$(docker inspect -f '{{.State.Health.Status}}' primeerp-backend 2>/dev/null || true)
            frontend_status=$(docker inspect -f '{{.State.Health.Status}}' primeerp-frontend 2>/dev/null || true)
            if [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              curl -fsS http://127.0.0.1:3000/ >/dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 db migrate backend frontend
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
