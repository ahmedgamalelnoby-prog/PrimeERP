name: PrimeERP Hosted Validation

# Retained as an explicit/manual legacy validation workflow.
# Canonical CI/release validation is PrimeERP Self-Hosted Release Gate.
# No automatic push/pull_request trigger is allowed here so this workflow
# cannot consume or compete for the single self-hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  legacy-validation:
    name: Legacy validation (manual only)
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 45
    steps:
      - name: Explain canonical gate
        shell: powershell
        run: |
          Write-Host 'This workflow is manual-only by design.'
          Write-Host 'Canonical automatic validation: PrimeERP Self-Hosted Release Gate.'
          Write-Host 'Runner labels: self-hosted / Windows / X64 / PrimeERP'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Legacy validation is intentionally not duplicated
        shell: powershell
        run: |
          Write-Host 'PASS: automatic duplicate validation is disabled.'
          Write-Host 'Use PrimeERP Self-Hosted Release Gate for the complete release gate.'
