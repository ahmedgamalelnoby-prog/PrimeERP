name: PrimeERP POS PostgreSQL Concurrency Gate

on:
  pull_request:
    paths:
      - "backend/app/modules/pos/**"
      - "backend/app/modules/commerce/**"
      - "backend/alembic/versions/**"
      - "backend/tests/test_pos_offline_postgres.py"
      - "docker-compose.yml"
      - ".github/workflows/pos-postgres-concurrency-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primeerp-pos-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency:
    name: PostgreSQL POS replay concurrency
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      POSTGRES_DB: primeerp_ci_pos
      POSTGRES_USER: primeerp
      POSTGRES_PASSWORD: primeerp_ci_password
      SECRET_KEY: primeerp_ci_secret
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: test
      DEBUG: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify Docker
        run: |
          $ErrorActionPreference = "Stop"
          docker version
          docker compose version
      - name: Start PostgreSQL and migrations
        run: |
          $ErrorActionPreference = "Stop"
          docker compose -p primeerp-pos-ci down -v --remove-orphans
          docker compose -p primeerp-pos-ci up -d db migrate
          docker compose -p primeerp-pos-ci ps
          docker compose -p primeerp-pos-ci run --rm backend-test alembic current
      - name: Run PostgreSQL POS concurrency tests
        run: |
          $ErrorActionPreference = "Stop"
          $env:TEST_DATABASE_URL = "postgresql+psycopg://primeerp:primeerp_ci_password@db:5432/primeerp_ci_pos"
          docker compose -p primeerp-pos-ci run --rm -e TEST_DATABASE_URL=$env:TEST_DATABASE_URL backend-test python -m pytest -q tests/test_pos_offline_postgres.py
      - name: Cleanup
        if: always()
        run: |
          docker compose -p primeerp-pos-ci down -v --remove-orphans
