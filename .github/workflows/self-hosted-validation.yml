name: PrimeERP Self-Hosted Validation

on:
  push:
    branches:
      - feature/modern-ui-legal-admin
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Self-hosted full validation
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate toolchain
        shell: powershell
        run: |
          python --version
          node --version
          npm --version
          git --version
          docker version

      - name: Backend, frontend and repository validation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $container = "primeerp-ci-postgres"
          try {
            docker rm -f $container 2>$null
            if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }

            docker run -d --name $container -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p 55432:5432 postgres:17

            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              docker exec $container pg_isready -U primeerp -d primeerp_ci
              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              throw "PostgreSQL container did not become ready."
            }

            Push-Location backend
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest
            python -m compileall -q app
            $env:DATABASE_URL = "postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci"
            python -m alembic upgrade head
            python -m alembic check
            if (Test-Path tests) {
              $tests = Get-ChildItem tests -Recurse -Filter "test_*.py" -File
              if ($tests.Count -gt 0) {
                python -m pytest -q
              } else {
                Write-Host "No backend tests found; compile and migration checks passed."
              }
            } else {
              Write-Host "No backend tests directory; compile and migration checks passed."
            }
            Pop-Location

            Push-Location frontend
            npm ci
            npm run lint
            npm run build
            Pop-Location

            $tracked = git ls-files
            foreach ($file in $tracked) {
              if ($file -match '(^|/)(\.env|\.env\..*)$|\.pyc$|/__pycache__/|/\.venv/|\.backup$|\.bak$|/node_modules/|/dist/$') {
                throw "Forbidden tracked/generated file: $file"
              }
            }

            $crossRefs = git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'
            if ($LASTEXITCODE -eq 0 -and $crossRefs) {
              $crossRefs
              throw "Cross-system reference detected in PrimeERP."
            }

            Write-Host "PrimeERP self-hosted validation passed."
          }
          finally {
            Pop-Location -ErrorAction SilentlyContinue
            docker rm -f $container 2>$null
            $global:LASTEXITCODE = 0
          }
