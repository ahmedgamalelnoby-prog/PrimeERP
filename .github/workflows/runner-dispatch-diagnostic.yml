name: PrimeERP Runner Dispatch Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-dispatch-diagnostic.yml'

permissions:
  contents: read

jobs:
  hosted-ubuntu:
    name: Hosted runner - ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove runner reached workflow steps
        run: |
          set -e
          echo "RUNNER_DIAGNOSTIC=hosted-ubuntu-24.04"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_JOB=$GITHUB_JOB"

  hosted-slim:
    name: Hosted runner - ubuntu-slim
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Prove slim runner reached workflow steps
        run: |
          set -e
          echo "RUNNER_DIAGNOSTIC=hosted-ubuntu-slim"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_JOB=$GITHUB_JOB"
