name: PrimeERP Windows Runner Isolation

on:
  push:
    paths:
      - '.github/workflows/runner-windows-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runner:
    name: Windows runner provisioning smoke
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        shell: powershell
        run: |
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "os=$env:RUNNER_OS"
          Write-Host "arch=$env:RUNNER_ARCH"
          whoami
      - name: Toolchain
        shell: powershell
        run: |
          git --version
          python --version
          node --version
          npm --version
      - name: Docker availability
        shell: powershell
        run: |
          docker --version
          docker info
      - name: Execution smoke
        shell: powershell
        run: Write-Host 'WINDOWS_RUNNER_EXECUTION=PASS'
