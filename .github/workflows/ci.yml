name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke and tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Python runtime
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python is unavailable.' }
      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: |
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python.exe -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Python sources
        run: .\.ci-venv\Scripts\python.exe -m compileall -q app
      - name: Validate modular architecture
        run: .\.ci-venv\Scripts\python.exe scripts\check_modular_architecture.py
      - name: Validate API security boundaries
        run: .\.ci-venv\Scripts\python.exe scripts\check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .\.ci-venv\Scripts\python.exe scripts\smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .\.ci-venv\Scripts\python.exe scripts\check_production_config.py
      - name: Require a single Alembic head
        run: |
          .\.ci-venv\Scripts\python.exe -m alembic heads | Tee-Object alembic-heads.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $heads = Get-Content alembic-heads.txt -Raw
          $count = ([regex]::Matches($heads, '\(head\)')).Count
          if ($count -ne 1) { throw "Expected exactly one Alembic head; found $count" }
      - name: Run tests
        run: .\.ci-venv\Scripts\python.exe -m pytest -q

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Node.js runtime
        run: |
          node --version
          npm --version
          $major = [int](node -p "process.versions.node.split('.')[0]")
          if ($major -lt 20) { throw "Node.js 20+ is required; found $major" }
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject cross-system references and generated files
        shell: pwsh
        run: |
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^|/)\.env$|(^|/)__pycache__(/|$)|(^|/)node_modules(/|$)|(^|/)dist(/|$)|\.pyc$|\.backup$|\.bak$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked/generated file: $_" }
            exit 1
          }
          $matches = git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0 -and $matches) {
            Write-Error 'Cross-system reference detected in PrimeERP.'
            $matches
            exit 1
          }
          Write-Host 'PrimeERP repository boundary check passed.'
