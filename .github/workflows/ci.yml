name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke and tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve local Python runtime
        shell: powershell
        run: |
          $candidates = @(
            (Get-Command python -ErrorAction SilentlyContinue).Source,
            "$env:LOCALAPPDATA\Programs\Python\Python310\python.exe",
            "$env:ProgramFiles\Python310\python.exe",
            "C:\Python310\python.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $python = $candidates | Select-Object -First 1
          if (-not $python) { throw "Python runtime was not found on the self-hosted runner." }
          $version = & $python --version 2>&1
          if ($version -notmatch 'Python 3\.10\.') { throw "Expected Python 3.10.x but found $version at $python" }
          "PYTHON_BIN=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $python --version

      - name: Create isolated CI virtual environment
        run: '& $env:PYTHON_BIN -m venv .ci-venv'

      - name: Install dependencies
        run: |
          & .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt
          & .\.ci-venv\Scripts\python.exe -m pip install pytest

      - name: Compile Python sources
        run: '& .\.ci-venv\Scripts\python.exe -m compileall -q app'

      - name: Validate modular architecture
        run: '& .\.ci-venv\Scripts\python.exe scripts\check_modular_architecture.py'

      - name: Validate API security boundaries
        run: '& .\.ci-venv\Scripts\python.exe scripts\check_api_security.py'

      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: '& .\.ci-venv\Scripts\python.exe scripts\smoke_import.py'

      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: '& .\.ci-venv\Scripts\python.exe scripts\check_production_config.py'

      - name: Validate release architecture and Docker contract
        run: '& .\.ci-venv\Scripts\python.exe scripts\check_release_readiness.py'

      - name: Require a single Alembic head
        run: |
          & .\.ci-venv\Scripts\python.exe -m alembic heads | Tee-Object alembic-heads.txt
          & .\.ci-venv\Scripts\python.exe -c "from pathlib import Path; n=sum('(head)' in x for x in Path('alembic-heads.txt').read_text().splitlines()); assert n == 1, f'Expected exactly one Alembic head; found {n}'"

      - name: Run tests
        run: '& .\.ci-venv\Scripts\python.exe -m pytest -q'

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve local Node.js runtime
        shell: powershell
        run: |
          $candidates = @(
            (Get-Command node -ErrorAction SilentlyContinue).Source,
            "$env:ProgramFiles\nodejs\node.exe",
            "$env:LOCALAPPDATA\Programs\nodejs\node.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $node = $candidates | Select-Object -First 1
          if (-not $node) { throw "Node.js runtime was not found on the self-hosted runner." }
          $major = [int]((& $node --version).Trim().TrimStart('v').Split('.')[0])
          if ($major -lt 20) { throw "Expected Node.js 20+ but found major version $major at $node" }
          $nodeDir = Split-Path $node -Parent
          $env:Path = "$nodeDir;$env:Path"
          "NODE_BIN=$node" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NODE_DIR=$nodeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $node --version
          & npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject cross-system references and generated files
        shell: powershell
        run: |
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object { $_ -match '(^|/)(\.env|__pycache__|node_modules|dist)(/|$)|\.(pyc|backup|bak)$' }
          if ($forbidden) {
            $forbidden
            throw "Forbidden tracked/generated file detected."
          }

          $crossSystem = git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0 -and $crossSystem) {
            $crossSystem
            throw "Cross-system reference detected in PrimeERP."
          }

          Write-Host "PrimeERP repository boundary check passed."
