name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_POSTGRES_PORT: 55432
  DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke, tests and migrations
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Docker CLI
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'primeerp-docker-cli'
          $bin = Join-Path $root 'bin'
          $config = Join-Path $root 'config'
          $plugins = Join-Path $config 'cli-plugins'
          New-Item -ItemType Directory -Force -Path $bin, $plugins | Out-Null
          $dockerExe = @(
            'C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe',
            'C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dockerExe) {
            $dockerZip = Join-Path $root 'docker-29.8.0.zip'
            if (-not (Test-Path (Join-Path $bin 'docker.exe'))) {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://download.docker.com/win/static/stable/x86_64/docker-29.8.0.zip' -OutFile $dockerZip
              Expand-Archive -Path $dockerZip -DestinationPath $root -Force
              $candidate = Get-ChildItem -Path $root -Filter docker.exe -Recurse | Select-Object -First 1
              if (-not $candidate) { throw 'Docker CLI archive did not contain docker.exe.' }
              Copy-Item $candidate.FullName (Join-Path $bin 'docker.exe') -Force
            }
            $dockerExe = Join-Path $bin 'docker.exe'
          }
          $composeExe = Join-Path $plugins 'docker-compose.exe'
          if (-not (Test-Path $composeExe)) {
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-windows-x86_64.exe' -OutFile $composeExe
          }
          $dockerDir = Split-Path $dockerExe -Parent
          if ($dockerDir -ne $bin) { Copy-Item $dockerExe (Join-Path $bin 'docker.exe') -Force; $dockerExe = Join-Path $bin 'docker.exe' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOCKER_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOCKER_HOST=npipe:////./pipe/dockerDesktopLinuxEngine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $dockerExe version
          & $dockerExe compose version
      - name: Validate runtime
        run: |
          python --version
          if errorlevel 1 exit /b 1
          docker version
          if errorlevel 1 exit /b 1
      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: |
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt
          if errorlevel 1 exit /b 1
          .\.ci-venv\Scripts\python.exe -m pip install pytest
          if errorlevel 1 exit /b 1
      - name: Compile Python sources
        run: .\.ci-venv\Scripts\python.exe -m compileall -q app
      - name: Validate modular architecture
        run: .\.ci-venv\Scripts\python.exe scripts\check_modular_architecture.py
      - name: Validate API security boundaries
        run: .\.ci-venv\Scripts\python.exe scripts\check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .\.ci-venv\Scripts\python.exe scripts\smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .\.ci-venv\Scripts\python.exe scripts\check_production_config.py
      - name: Prepare CI database
        working-directory: .
        run: |
          docker rm -f primeerp-ci-postgres 2>NUL
          docker run -d --name primeerp-ci-postgres -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p %CI_POSTGRES_PORT%:5432 postgres:17
          if errorlevel 1 exit /b 1
          set "READY=0"
          for /L %%N in (1,1,30) do (
            if "%READY%"=="0" (
              docker exec primeerp-ci-postgres pg_isready -U primeerp -d primeerp_ci >NUL 2>&1
              if not errorlevel 1 set "READY=1"
              if "%READY%"=="0" timeout /t 2 /nobreak >NUL
            )
          )
          if "%READY%"=="0" (
            docker logs primeerp-ci-postgres
            exit /b 1
          )
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .\.ci-venv\Scripts\python.exe -m alembic upgrade head
      - name: Require a single Alembic head
        run: .\.ci-venv\Scripts\python.exe -c "import subprocess,sys; o=subprocess.check_output([sys.executable,'-m','alembic','heads'],text=True); print(o); n=o.count('(head)'); assert n==1, f'Expected exactly one Alembic head; found {n}'"
      - name: Check Alembic configuration
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .\.ci-venv\Scripts\python.exe -m alembic check
      - name: Run tests
        run: .\.ci-venv\Scripts\python.exe -m pytest -q
      - name: Cleanup CI database
        if: always()
        working-directory: .
        run: |
          docker rm -f primeerp-ci-postgres >NUL 2>&1
          exit /b 0

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Node.js runtime
        run: |
          node --version
          if errorlevel 1 exit /b 1
          npm --version
          if errorlevel 1 exit /b 1
          node -e "if(Number(process.versions.node.split('.')[0])<20) process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, PrimeERP]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject cross-system references and generated files
        shell: cmd
        run: |
          git ls-files | findstr /R /C:"^\.env$" /C:"__pycache__" /C:"node_modules" /C:"dist/" /C:"\.pyc$" /C:"\.backup$" /C:"\.bak$" >NUL 2>&1
          if not errorlevel 1 (
            echo Forbidden tracked/generated file detected.
            exit /b 1
          )
          git grep -n -I -E "CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)" -- ":!docs/SYSTEM_BOUNDARIES.md" ":!.github/workflows/ci.yml" >NUL 2>&1
          if not errorlevel 1 (
            echo Cross-system reference detected in PrimeERP.
            exit /b 1
          )
          echo PrimeERP repository boundary check passed.
          exit /b 0
