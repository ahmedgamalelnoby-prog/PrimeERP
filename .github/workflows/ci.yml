name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_POSTGRES_PORT: 55432
  DOCKER_CLI_PATH: 'C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin'

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& {0}"

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke, tests and migrations
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& {0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate runner toolchain
        working-directory: .
        run: |
          $dockerBin = $env:DOCKER_CLI_PATH
          if (-not (Test-Path "$dockerBin\docker.exe")) { throw "Docker CLI not found at $dockerBin" }
          $env:Path = "$dockerBin;$env:Path"
          docker version
          py -3.10 --version
      - name: Create isolated CI virtual environment
        run: py -3.10 -m venv .ci-venv
      - name: Validate isolated Python runtime
        run: |
          $python = "$PWD\.ci-venv\Scripts\python.exe"
          $version = (& $python --version 2>&1).ToString()
          $version
          if ($version -notmatch '^Python 3\.10\.') { throw "PrimeERP CI requires Python 3.10; found $version." }
      - name: Install dependencies
        run: |
          $python = "$PWD\.ci-venv\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r requirements.txt
          & $python -m pip install pytest
      - name: Compile Python sources
        run: .\.ci-venv\Scripts\python.exe -m compileall -q app
      - name: Validate modular architecture
        run: .\.ci-venv\Scripts\python.exe scripts/check_modular_architecture.py
      - name: Validate API security boundaries
        run: .\.ci-venv\Scripts\python.exe scripts/check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .\.ci-venv\Scripts\python.exe scripts/smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .\.ci-venv\Scripts\python.exe scripts/check_production_config.py
      - name: Prepare CI database
        working-directory: .
        run: |
          $env:Path = "$env:DOCKER_CLI_PATH;$env:Path"
          docker rm -f primeerp-ci-postgres 2>$null
          docker run -d --name primeerp-ci-postgres -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p ${env:CI_POSTGRES_PORT}:5432 postgres:17
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            docker exec primeerp-ci-postgres pg_isready -U primeerp -d primeerp_ci
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { docker logs primeerp-ci-postgres; exit 1 }
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .\.ci-venv\Scripts\alembic.exe upgrade head
      - name: Require a single Alembic head
        run: |
          $heads = & .\.ci-venv\Scripts\alembic.exe heads
          $heads
          $count = ($heads | Select-String '\(head\)').Count
          if ($count -ne 1) { throw "Expected exactly one Alembic head; found $count." }
      - name: Check Alembic configuration
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .\.ci-venv\Scripts\alembic.exe check
      - name: Run tests
        run: |
          $tests = Get-ChildItem -Path tests -Filter 'test_*.py' -File -ErrorAction SilentlyContinue
          if ($tests) { .\.ci-venv\Scripts\python.exe -m pytest -q } else { Write-Host 'No backend tests found; compile, architecture and smoke checks passed.' }
      - name: Cleanup CI database
        if: always()
        working-directory: .
        run: |
          $env:Path = "$env:DOCKER_CLI_PATH;$env:Path"
          docker rm -f primeerp-ci-postgres 2>$null

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& {0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Node.js runtime
        run: |
          node --version
          npm --version
          $major = node -p "process.versions.node.split('.')[0]"
          if ([int]$major -lt 20) { throw "PrimeERP CI requires Node.js 20+ on the self-hosted runner; found $major." }
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, PrimeERP]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& {0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject cross-system references and generated files
        run: |
          $bad = $false
          $tracked = git ls-files
          foreach ($file in $tracked) {
            if ($file -match '(^|/)(\.env($|/)|__pycache__/|node_modules/|dist/)|\.pyc$|\.backup$|\.bak$') {
              Write-Host "Forbidden tracked/generated file: $file"
              $bad = $true
            }
          }
          $matches = git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0) {
            $matches
            Write-Host 'Cross-system reference detected in PrimeERP.'
            $bad = $true
          }
          if ($bad) { exit 1 }
          Write-Host 'PrimeERP repository boundary check passed.'
