name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke, tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: primeerp
          POSTGRES_PASSWORD: primeerp
          POSTGRES_DB: primeerp_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U primeerp -d primeerp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate runtime
        run: |
          python --version
          docker version
          docker compose version

      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv

      - name: Install dependencies
        run: |
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -r requirements.txt
          .ci-venv/bin/python -m pip install pytest

      - name: Compile Python sources
        run: .ci-venv/bin/python -m compileall -q app

      - name: Validate modular architecture
        run: .ci-venv/bin/python scripts/check_modular_architecture.py

      - name: Validate API security boundaries
        run: .ci-venv/bin/python scripts/check_api_security.py

      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .ci-venv/bin/python scripts/smoke_import.py

      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .ci-venv/bin/python scripts/check_production_config.py

      - name: Run Alembic migrations
        run: .ci-venv/bin/python -m alembic upgrade head

      - name: Require a single Alembic head
        run: |
          .ci-venv/bin/python -m alembic heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1

      - name: Check Alembic configuration
        run: .ci-venv/bin/python -m alembic check

      - name: Run tests
        run: .ci-venv/bin/python -m pytest -q

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Node.js runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject cross-system references and generated files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^\.env$|__pycache__|node_modules|dist/|\.pyc$|\.backup$|\.bak$)'; then
            echo 'Forbidden tracked/generated file detected.'
            exit 1
          fi
          if git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'; then
            echo 'Cross-system reference detected in PrimeERP.'
            exit 1
          fi
          echo 'PrimeERP repository boundary check passed.'
