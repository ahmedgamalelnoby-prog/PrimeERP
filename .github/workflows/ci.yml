name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_POSTGRES_PORT: 55432

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke, tests and migrations
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 30
    defaults:
      run:
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage Docker CLI for service runner
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files\Docker\Docker\resources\bin',
            'C:\ProgramData\DockerDesktop\version-bin',
            'C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin'
          )
          $sourceDir = $null
          foreach ($dir in $candidates) {
            if (Test-Path -LiteralPath (Join-Path $dir 'docker.exe')) { $sourceDir = $dir; break }
          }
          if (-not $sourceDir) {
            $resolved = @(where.exe docker 2>$null)
            if ($resolved.Count -gt 0) { $sourceDir = Split-Path $resolved[0] -Parent }
          }
          if (-not $sourceDir) { throw 'Docker CLI was not found in an installed/system location.' }
          $stageDir = Join-Path $env:RUNNER_TEMP 'primeerp-docker-cli'
          if (Test-Path -LiteralPath $stageDir) { Remove-Item -LiteralPath $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $sourceDir 'docker.exe') -Destination $stageDir -Force
          $composePlugin = Join-Path $sourceDir 'docker-compose.exe'
          if (Test-Path -LiteralPath $composePlugin) { Copy-Item -LiteralPath $composePlugin -Destination $stageDir -Force }
          $cliPlugins = Join-Path $sourceDir 'cli-plugins'
          if (Test-Path -LiteralPath $cliPlugins) { Copy-Item -LiteralPath $cliPlugins -Destination $stageDir -Recurse -Force }
          Get-ChildItem -LiteralPath $stageDir -Recurse -File | Unblock-File -ErrorAction SilentlyContinue
          $wrapper = Join-Path $stageDir 'docker.cmd'
          Set-Content -LiteralPath $wrapper -Encoding ASCII -Value "@echo off`r`n\"%~dp0docker.exe\" %*`r`n"
          Add-Content $env:GITHUB_PATH $stageDir
          $env:Path = "$stageDir;$env:Path"
          & cmd.exe /d /c "\"$wrapper\" version"
          if ($LASTEXITCODE -ne 0) { throw "Docker CLI version check failed with exit code $LASTEXITCODE" }
          & cmd.exe /d /c "\"$wrapper\" compose version"
          if ($LASTEXITCODE -ne 0) { throw "Docker Compose version check failed with exit code $LASTEXITCODE" }
      - name: Validate runtime
        run: |
          cmd.exe /d /c "python --version"
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime check failed' }
          cmd.exe /d /c "docker version"
          if ($LASTEXITCODE -ne 0) { throw 'Docker runtime check failed' }
      - name: Create isolated CI virtual environment
        run: cmd.exe /d /c "python -m venv .ci-venv"
      - name: Install dependencies
        run: |
          cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m pip install --upgrade pip"
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw 'dependency installation failed' }
          cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m pip install pytest"
          if ($LASTEXITCODE -ne 0) { throw 'pytest installation failed' }
      - name: Compile Python sources
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m compileall -q app"
      - name: Validate modular architecture
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe scripts\check_modular_architecture.py"
      - name: Validate API security boundaries
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe scripts\check_api_security.py"
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe scripts\smoke_import.py"
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe scripts\check_production_config.py"
      - name: Prepare CI database
        working-directory: .
        run: |
          cmd.exe /d /c "docker rm -f primeerp-ci-postgres 2>NUL"
          cmd.exe /d /c "docker run -d --name primeerp-ci-postgres -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p %CI_POSTGRES_PORT%:5432 postgres:17"
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL container failed to start' }
          $ready = $false
          1..30 | ForEach-Object {
            if ($ready) { return }
            cmd.exe /d /c "docker exec primeerp-ci-postgres pg_isready -U primeerp -d primeerp_ci"
            if ($LASTEXITCODE -eq 0) { $ready = $true; return }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { cmd.exe /d /c "docker logs primeerp-ci-postgres"; throw 'PostgreSQL did not become ready' }
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m alembic upgrade head"
      - name: Require a single Alembic head
        run: |
          $heads = cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m alembic heads"
          $heads | Write-Output
          $count = @($heads | Select-String '\(head\)').Count
          if ($count -ne 1) { throw "Expected exactly one Alembic head; found $count" }
      - name: Check Alembic configuration
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m alembic check"
      - name: Run tests
        run: cmd.exe /d /c ".\.ci-venv\Scripts\python.exe -m pytest -q"
      - name: Cleanup CI database
        if: always()
        working-directory: .
        run: cmd.exe /d /c "docker rm -f primeerp-ci-postgres 2>NUL"

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 20
    defaults:
      run:
        shell: 'cmd.exe /d /s /c "{0}"'
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Node.js runtime
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major<20){process.exit(1)}"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, PrimeERP]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject cross-system references and generated files
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = $false
          $tracked = cmd.exe /d /c "git ls-files"
          $tracked | ForEach-Object {
            $file = $_
            if ($file -match '(^|/)(\.env($|/)|__pycache__/|node_modules/|dist/)|\.pyc$|\.backup$|\.bak$') {
              Write-Output "Forbidden tracked/generated file: $file"
              $bad = $true
            }
          }
          $matches = cmd.exe /d /c "git grep -n -I -E \"CommercialERP|ContentAI|commercialERP|contentai|D:\\\\(commercialERP|ContentAI)\" -- \":!docs/SYSTEM_BOUNDARIES.md\" \":!.github/workflows/ci.yml\""
          if ($LASTEXITCODE -eq 0 -and $matches) {
            $matches | Write-Output
            Write-Output 'Cross-system reference detected in PrimeERP.'
            $bad = $true
          }
          if ($bad) { throw 'Repository boundary check failed.' }
          Write-Output 'PrimeERP repository boundary check passed.'
