name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_POSTGRES_PORT: 55432

jobs:
  backend:
    name: Backend - compile, architecture, smoke, tests and migrations
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        shell: powershell
        run: python -m pip install --upgrade pip; pip install -r requirements.txt; pip install pytest
      - name: Compile Python sources
        shell: powershell
        run: python -m compileall -q app
      - name: Validate modular architecture
        shell: powershell
        run: python scripts/check_modular_architecture.py
      - name: Import application smoke test
        shell: powershell
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
        run: |
          python -c "import main; print('Application import OK:', main.app.title)"
      - name: Prepare CI database
        shell: powershell
        run: |
          docker rm -f primeerp-ci-postgres 2>$null
          docker run -d --name primeerp-ci-postgres -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p ${env:CI_POSTGRES_PORT}:5432 postgres:17
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            docker exec primeerp-ci-postgres pg_isready -U primeerp -d primeerp_ci
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { docker logs primeerp-ci-postgres; exit 1 }
      - name: Run Alembic migrations
        shell: powershell
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: python -m alembic upgrade head
      - name: Require a single Alembic head
        shell: powershell
        run: |
          $heads = python -m alembic heads
          $heads
          $count = ($heads | Select-String '\(head\)').Count
          if ($count -ne 1) { throw "Expected exactly one Alembic head; found $count." }
      - name: Check Alembic configuration
        shell: powershell
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: python -m alembic check
      - name: Run tests
        shell: powershell
        run: |
          $tests = Get-ChildItem -Path tests -Filter 'test_*.py' -File -ErrorAction SilentlyContinue
          if ($tests) { python -m pytest -q } else { Write-Host 'No backend tests found; compile, architecture and smoke checks passed.' }
      - name: Cleanup CI database
        if: always()
        shell: powershell
        run: docker rm -f primeerp-ci-postgres 2>$null

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        shell: powershell
        run: npm ci
      - name: Typecheck
        shell: powershell
        run: npm run typecheck --if-present
      - name: Lint
        shell: powershell
        run: npm run lint
      - name: Production build
        shell: powershell
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject cross-system references and generated files
        shell: powershell
        run: |
          $bad = $false
          $tracked = git ls-files
          foreach ($file in $tracked) {
            if ($file -match '(^|/)(\.env($|\.)|__pycache__/|node_modules/|dist/)|\.pyc$|\.backup$|\.bak$') {
              Write-Host "Forbidden tracked/generated file: $file"
              $bad = $true
            }
          }
          $matches = git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0) {
            $matches
            Write-Host 'Cross-system reference detected in PrimeERP.'
            $bad = $true
          }
          if ($bad) { exit 1 }
          Write-Host 'PrimeERP repository boundary check passed.'
