name: PrimeERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - compile, tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run tests
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No backend tests found; compile check passed."
          fi
      - name: Check Alembic configuration
        run: python -m alembic check
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject cross-system references and generated files
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.env|*.env.*|*/.env|*/.env.*|*.pyc|*/__pycache__/*|*/.venv/*|*.backup|*.bak|*/node_modules/*|*/dist/*)
                echo "Forbidden tracked/generated file: $file"
                bad=1
                ;;
            esac
          done < <(git ls-files -z)

          if git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'; then
            echo "Cross-system reference detected in PrimeERP."
            bad=1
          fi

          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "PrimeERP repository boundary check passed."
