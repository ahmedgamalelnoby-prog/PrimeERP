name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate Python runtime
        run: |
          python --version
          python - <<'PY'
          import sys
          assert sys.version_info >= (3, 10), sys.version
          PY
      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: |
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -r requirements.txt
          .ci-venv/bin/python -m pip install pytest
      - name: Compile Python sources
        run: .ci-venv/bin/python -m compileall -q app
      - name: Validate modular architecture
        run: .ci-venv/bin/python scripts/check_modular_architecture.py
      - name: Validate API security boundaries
        run: .ci-venv/bin/python scripts/check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .ci-venv/bin/python scripts/smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .ci-venv/bin/python scripts/check_production_config.py
      - name: Require a single Alembic head
        run: |
          .ci-venv/bin/python -m alembic heads | tee alembic-heads.txt
          test "$(grep -c '(head)' alembic-heads.txt)" -eq 1
      - name: Run tests
        run: .ci-venv/bin/python -m pytest -q

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Node.js runtime
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject cross-system references and generated files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|(^|/)__pycache__(/|$)|(^|/)node_modules(/|$)|(^|/)dist(/|$)|\.pyc$|\.backup$|\.bak$' || true)
          if [ -n "$forbidden" ]; then
            echo "$forbidden"
            echo 'Forbidden tracked/generated file detected.'
            exit 1
          fi
          matches=$(git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Cross-system reference detected in PrimeERP.'
            exit 1
          fi
          echo 'PrimeERP repository boundary check passed.'
