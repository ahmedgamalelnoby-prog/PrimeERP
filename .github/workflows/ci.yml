name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke, tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate runner toolchain
        working-directory: .
        run: |
          python --version
          docker --version
          docker compose version
      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: |
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -r requirements.txt
          .ci-venv/bin/python -m pip install pytest
      - name: Compile Python sources
        run: .ci-venv/bin/python -m compileall -q app
      - name: Validate modular architecture
        run: .ci-venv/bin/python scripts/check_modular_architecture.py
      - name: Validate API security boundaries
        run: .ci-venv/bin/python scripts/check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .ci-venv/bin/python scripts/smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: "false"
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .ci-venv/bin/python scripts/check_production_config.py
      - name: Prepare CI database
        working-directory: .
        run: |
          docker rm -f primeerp-ci-postgres >/dev/null 2>&1 || true
          docker run -d --name primeerp-ci-postgres -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p 55432:5432 postgres:17
          ready=false
          for i in {1..30}; do
            if docker exec primeerp-ci-postgres pg_isready -U primeerp -d primeerp_ci >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then docker logs primeerp-ci-postgres; exit 1; fi
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .ci-venv/bin/alembic upgrade head
      - name: Require a single Alembic head
        run: |
          heads="$(.ci-venv/bin/alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then echo "Expected exactly one Alembic head; found $count."; exit 1; fi
      - name: Check Alembic configuration
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .ci-venv/bin/alembic check
      - name: Run tests
        run: |
          if find tests -maxdepth 1 -type f -name 'test_*.py' -print -quit | grep -q .; then .ci-venv/bin/python -m pytest -q; else echo 'No backend tests found; structural and migration checks passed.'; fi
      - name: Cleanup CI database
        if: always()
        working-directory: .
        run: docker rm -f primeerp-ci-postgres >/dev/null 2>&1 || true

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject cross-system references and generated files
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            if [[ "$file" =~ (^|/)(\.env($|/)|__pycache__/|node_modules/|dist/)|\.pyc$|\.backup$|\.bak$ ]]; then echo "Forbidden tracked/generated file: $file"; bad=1; fi
          done < <(git ls-files)
          if matches=$(git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml'); then
            printf '%s\n' "$matches"
            echo 'Cross-system reference detected in PrimeERP.'
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo 'PrimeERP repository boundary check passed.'
