name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_POSTGRES_PORT: 55432

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke, tests and migrations
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 30
    defaults:
      run:
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Docker CLI for service runner
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDir = Join-Path $env:RUNNER_TEMP 'primeerp-docker-cli'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $dockerExe = Join-Path $toolDir 'docker.exe'
          if (-not (Test-Path $dockerExe)) {
            $zip = Join-Path $env:RUNNER_TEMP 'docker-cli.zip'
            Invoke-WebRequest -Uri 'https://download.docker.com/win/static/stable/x86_64/docker-29.8.0.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'docker-cli-extract') -Force
            Copy-Item (Join-Path $env:RUNNER_TEMP 'docker-cli-extract\docker\docker.exe') $dockerExe -Force
          }
          $env:Path = "$toolDir;$env:Path"
          Add-Content $env:GITHUB_PATH $toolDir
          & $dockerExe version
      - name: Validate runtime
        run: |
          python --version
          docker version
      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: |
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.ci-venv\Scripts\python.exe -m pip install pytest
      - name: Compile Python sources
        run: .\.ci-venv\Scripts\python.exe -m compileall -q app
      - name: Validate modular architecture
        run: .\.ci-venv\Scripts\python.exe scripts\check_modular_architecture.py
      - name: Validate API security boundaries
        run: .\.ci-venv\Scripts\python.exe scripts\check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .\.ci-venv\Scripts\python.exe scripts\smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .\.ci-venv\Scripts\python.exe scripts\check_production_config.py
      - name: Prepare CI database
        working-directory: .
        run: |
          docker rm -f primeerp-ci-postgres 2>$null
          docker run -d --name primeerp-ci-postgres -e POSTGRES_USER=primeerp -e POSTGRES_PASSWORD=primeerp -e POSTGRES_DB=primeerp_ci -p ${env:CI_POSTGRES_PORT}:5432 postgres:17
          $ready = $false
          1..30 | ForEach-Object {
            if ($ready) { return }
            docker exec primeerp-ci-postgres pg_isready -U primeerp -d primeerp_ci *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; return }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { docker logs primeerp-ci-postgres; throw 'PostgreSQL did not become ready' }
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .\.ci-venv\Scripts\python.exe -m alembic upgrade head
      - name: Require a single Alembic head
        run: |
          $heads = .\.ci-venv\Scripts\python.exe -m alembic heads
          $heads | Write-Output
          $count = @($heads | Select-String '\(head\)').Count
          if ($count -ne 1) { throw "Expected exactly one Alembic head; found $count" }
      - name: Check Alembic configuration
        env:
          DATABASE_URL: postgresql+psycopg://primeerp:primeerp@127.0.0.1:55432/primeerp_ci
        run: .\.ci-venv\Scripts\python.exe -m alembic check
      - name: Run tests
        run: .\.ci-venv\Scripts\python.exe -m pytest -q
      - name: Cleanup CI database
        if: always()
        working-directory: .
        run: docker rm -f primeerp-ci-postgres 2>$null

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 20
    defaults:
      run:
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Node.js runtime
        run: |
          node --version
          npm --version
          $major = [int](node -p "process.versions.node.split('.')[0]")
          if ($major -lt 20) { throw "PrimeERP CI requires Node.js 20+; found $major" }
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, PrimeERP]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject cross-system references and generated files
        shell: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = $false
          git ls-files | ForEach-Object {
            $file = $_
            if ($file -match '(^|/)(\.env($|/)|__pycache__/|node_modules/|dist/)|\.pyc$|\.backup$|\.bak$') {
              Write-Output "Forbidden tracked/generated file: $file"
              $bad = $true
            }
          }
          $matches = git grep -n -I -E 'CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)' -- ':!docs/SYSTEM_BOUNDARIES.md' ':!.github/workflows/ci.yml' 2>$null
          if ($LASTEXITCODE -eq 0 -and $matches) {
            $matches | Write-Output
            Write-Output 'Cross-system reference detected in PrimeERP.'
            $bad = $true
          }
          if ($bad) { throw 'Repository boundary check failed.' }
          Write-Output 'PrimeERP repository boundary check passed.'
