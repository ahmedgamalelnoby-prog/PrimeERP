name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke and tests
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Python runtime
        run: |
          python --version
          if errorlevel 1 exit /b 1
      - name: Create isolated CI virtual environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: |
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt
          if errorlevel 1 exit /b 1
          .\.ci-venv\Scripts\python.exe -m pip install pytest
          if errorlevel 1 exit /b 1
      - name: Compile Python sources
        run: .\.ci-venv\Scripts\python.exe -m compileall -q app
      - name: Validate modular architecture
        run: .\.ci-venv\Scripts\python.exe scripts\check_modular_architecture.py
      - name: Validate API security boundaries
        run: .\.ci-venv\Scripts\python.exe scripts\check_api_security.py
      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .\.ci-venv\Scripts\python.exe scripts\smoke_import.py
      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .\.ci-venv\Scripts\python.exe scripts\check_production_config.py
      - name: Require a single Alembic head
        run: |
          .\.ci-venv\Scripts\python.exe -m alembic heads > alembic-heads.txt
          if errorlevel 1 exit /b 1
          type alembic-heads.txt
          .\.ci-venv\Scripts\python.exe -c "from pathlib import Path; text=Path('alembic-heads.txt').read_text(); n=text.count('(head)'); assert n == 1, f'Expected exactly one Alembic head; found {n}'"
      - name: Run tests
        run: .\.ci-venv\Scripts\python.exe -m pytest -q

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Node.js runtime
        run: |
          node --version
          if errorlevel 1 exit /b 1
          npm --version
          if errorlevel 1 exit /b 1
          node -e "if(Number(process.versions.node.split('.')[0])<20) process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, PrimeERP]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject cross-system references and generated files
        shell: cmd
        run: |
          git ls-files | findstr /R /C:"^\.env$" /C:"__pycache__" /C:"node_modules" /C:"dist/" /C:"\.pyc$" /C:"\.backup$" /C:"\.bak$" >NUL 2>&1
          if not errorlevel 1 (
            echo Forbidden tracked/generated file detected.
            exit /b 1
          )
          git grep -n -I -E "CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)" -- ":!docs/SYSTEM_BOUNDARIES.md" ":!.github/workflows/ci.yml" >NUL 2>&1
          if not errorlevel 1 (
            echo Cross-system reference detected in PrimeERP.
            exit /b 1
          )
          echo PrimeERP repository boundary check passed.
          exit /b 0
