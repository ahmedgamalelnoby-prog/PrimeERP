name: PrimeERP CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend - compile, architecture, security, smoke and tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate and provision Python 3.10 runtime
        run: |
          if exist "C:\Users\Admin\AppData\Local\Programs\Python\Python310\python.exe" (
            "C:\Users\Admin\AppData\Local\Programs\Python\Python310\python.exe" --version
            "C:\Users\Admin\AppData\Local\Programs\Python\Python310\python.exe" -m venv .ci-venv
          ) else if exist "C:\Program Files\Python310\python.exe" (
            "C:\Program Files\Python310\python.exe" --version
            "C:\Program Files\Python310\python.exe" -m venv .ci-venv
          ) else if exist "C:\Python310\python.exe" (
            "C:\Python310\python.exe" --version
            "C:\Python310\python.exe" -m venv .ci-venv
          ) else if exist "C:\Windows\py.exe" (
            C:\Windows\py.exe -3.10 --version
            C:\Windows\py.exe -3.10 -m venv .ci-venv
          ) else if exist "%SystemRoot%\py.exe" (
            "%SystemRoot%\py.exe" -3.10 --version
            "%SystemRoot%\py.exe" -3.10 -m venv .ci-venv
          ) else (
            echo Python 3.10 runtime was not found on the self-hosted runner.
            exit /b 1
          )

      - name: Install dependencies
        run: |
          .ci-venv\Scripts\python.exe --version
          .ci-venv\Scripts\python.exe -m pip install --upgrade pip
          .ci-venv\Scripts\python.exe -m pip install -r requirements.txt
          .ci-venv\Scripts\python.exe -m pip install pytest

      - name: Compile Python sources
        run: .ci-venv\Scripts\python.exe -m compileall -q app

      - name: Validate modular architecture
        run: .ci-venv\Scripts\python.exe scripts\check_modular_architecture.py

      - name: Validate API security boundaries
        run: .ci-venv\Scripts\python.exe scripts\check_api_security.py

      - name: Import application smoke test
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: .ci-venv\Scripts\python.exe scripts\smoke_import.py

      - name: Validate production configuration rejects unsafe defaults
        env:
          APP_ENV: production
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./unsafe.db
          SECRET_KEY: your-secret-key-change-this-in-production
          CORS_ORIGINS: https://erp.example.com
        run: .ci-venv\Scripts\python.exe scripts\check_production_config.py

      - name: Validate release architecture and Docker contract
        run: .ci-venv\Scripts\python.exe scripts\check_release_readiness.py

      - name: Require a single Alembic head
        run: |
          .ci-venv\Scripts\python.exe -m alembic heads > alembic-heads.txt
          type alembic-heads.txt
          .ci-venv\Scripts\python.exe -c "from pathlib import Path; n=sum('(head)' in x for x in Path('alembic-heads.txt').read_text().splitlines()); assert n == 1, f'Expected exactly one Alembic head; found {n}'"

      - name: Run tests
        run: .ci-venv\Scripts\python.exe -m pytest -q

  frontend:
    name: Frontend - typecheck, lint and build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate local Node.js runtime
        run: |
          where node
          node --version
          npm --version
          node -e "if (parseInt(process.versions.node.split('.')[0]) < 20) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  repository:
    name: Repository boundaries and hygiene
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject cross-system references and generated files
        shell: cmd
        run: |
          git ls-files > tracked-files.txt
          findstr /R /C:"/__pycache__/" /C:"/node_modules/" /C:"/dist/" /C:"\.pyc$" /C:"\.backup$" /C:"\.bak$" tracked-files.txt > forbidden-files.txt
          if not errorlevel 1 (
            type forbidden-files.txt
            echo Forbidden tracked/generated file detected.
            exit /b 1
          )

          for /f "delims=" %%F in ('git ls-files ".env*"') do (
            if /I not "%%F"==".env.docker.example" if /I not "%%F"==".env.production.example" (
              echo Forbidden tracked environment file: %%F
              exit /b 1
            )
          )

          git grep -n -I -E "CommercialERP|ContentAI|commercialERP|contentai|D:\\(commercialERP|ContentAI)" -- ":!docs/SYSTEM_BOUNDARIES.md" ":!.github/workflows/ci.yml"
          if not errorlevel 1 (
            echo Cross-system reference detected in PrimeERP.
            exit /b 1
          )
          echo PrimeERP repository boundary check passed.
