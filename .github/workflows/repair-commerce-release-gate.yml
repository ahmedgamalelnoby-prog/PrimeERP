name: Repair Commerce Release Gate

on:
  push:
    branches:
      - feature/product-completion-final-tax2

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: remove repair workflow'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply root-cause fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace(path, old, new, label):
              p = ROOT / path
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"{label}: expected source pattern not found in {path}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print(f"FIXED {label}")

          accounting = "backend/app/modules/commerce/accounting_service.py"
          replace(accounting,
              'journal_id=settings.payment_journal_id, entry_number=f"PAY-{payment.id}", description=f"Payment {payment.id}", lines=lines, source_entity="payment", source_id=payment.id)',
              'journal_id=getattr(settings, "payment_journal_id", settings.cash_journal_id), entry_number=f"PAY-{payment.id}", description=f"Payment {payment.id}", lines=lines, source_entity="commerce_payment", source_id=payment.id)',
              "payment posting journal/source")

          replace(accounting,
              'grni_value = receipt_value\n                lines.append({"account_combination_id": settings.grni_account_id, "debit": grni_value, "credit": 0, "description": f"GRNI clearing {document.number}"})',
              'lines.append({"account_combination_id": settings.grni_account_id, "debit": receipt_value, "credit": 0, "description": f"GRNI clearing {document.number}"})',
              "purchase PPV receipt valuation")

          old_reversal = '''        original = self._existing_source(db, company_id=payment.company_id, source_entity="payment", source_id=payment.id)\n        if original is None:\n            raise HTTPException(409, "Original payment accounting entry was not found")\n        lines = [{"account_combination_id": line.account_combination_id, "debit": Decimal(line.credit), "credit": Decimal(line.debit), "description": f"Payment reversal {payment.id}"} for line in original.lines]\n        return self._post(db, company_id=payment.company_id, user_id=user_id, entry_date=reversal_date, journal_id=settings.payment_journal_id, entry_number=f"PAY-REV-{payment.id}", description=f"Payment reversal {payment.id}", lines=lines, source_entity="payment_reversal", source_id=payment.id)'''
          new_reversal = '''        original = None\n        if db is not None:\n            original = self._existing_source(db, company_id=payment.company_id, source_entity="commerce_payment", source_id=payment.id)\n        if original is not None:\n            lines = [{"account_combination_id": line.account_combination_id, "debit": Decimal(line.credit), "credit": Decimal(line.debit), "description": f"Payment reversal {payment.id}"} for line in original.lines]\n        else:\n            gross = Decimal(payment.amount)\n            wht = Decimal(payment.wht_amount or 0)\n            cash = gross - wht\n            if wht and settings.wht_account_id is None:\n                raise HTTPException(409, "WHT account is required when withholding tax is used")\n            if payment.document_kind == "sale":\n                lines = [{"account_combination_id": settings.ar_account_id, "debit": gross, "credit": 0, "description": f"Payment reversal {payment.id}"}, {"account_combination_id": settings.default_payment_account_id, "debit": 0, "credit": cash, "description": f"Payment reversal {payment.id}"}]\n                if wht:\n                    lines.append({"account_combination_id": settings.wht_account_id, "debit": 0, "credit": wht, "description": f"Payment reversal WHT {payment.id}"})\n            else:\n                lines = [{"account_combination_id": settings.default_payment_account_id, "debit": cash, "credit": 0, "description": f"Payment reversal {payment.id}"}]\n                if wht:\n                    lines.append({"account_combination_id": settings.wht_account_id, "debit": wht, "credit": 0, "description": f"Payment reversal WHT {payment.id}"})\n                lines.append({"account_combination_id": settings.ap_account_id, "debit": 0, "credit": gross, "description": f"Payment reversal {payment.id}"})\n        return self._post(db, company_id=payment.company_id, user_id=user_id, entry_date=reversal_date, journal_id=getattr(settings, "payment_journal_id", settings.cash_journal_id), entry_number=f"PAY-REV-{payment.id}", description=f"Payment reversal {payment.id}", lines=lines, source_entity="commerce_payment_reversal", source_id=payment.id)'''
          replace(accounting, old_reversal, new_reversal, "payment reversal lifecycle")

          router = "backend/app/modules/commerce/router.py"
          replace(router,
              'commerce_service.post_inventory(db, company_id, document_id, "purchase", current_user.id)',
              'commerce_service.post_inventory(db, company_id, document_id, "purchase", user_id=current_user.id)',
              "purchase receipt service transaction user context")

          returns = "backend/app/modules/commerce/sales_return_service.py"
          replace(returns,
              'raise ValueError(f"return quantity exceeds delivered quantity for line {source_line.id}; available {available}")',
              'raise ValueError(f"Return quantity exceeds delivered quantity for line {source_line.id}; available {available}")',
              "sales return quantity contract")

          inventory = "backend/app/modules/inventory/stock_moves/service.py"
          replace(inventory,
              'ProductVariant.company_id == company_id, ProductVariant.product_id == item.id, ProductVariant.is_active.is_(True)',
              'ProductVariant.company_id == company_id, ProductVariant.product_id == getattr(item, "id", None), ProductVariant.is_active.is_(True)',
              "stock variant validation compatibility")

          print("All source repairs applied.")
          '@ | Set-Content -Encoding UTF8 repair.py
          python repair.py
          Remove-Item repair.py -Force

      - name: Run focused commerce tests
        shell: pwsh
        working-directory: backend
        run: |
          python -m pytest -q tests/commerce tests/test_product_completion_domains.py tests/test_security_regressions.py tests/test_saas_suspension_entitlement.py tests/test_tenant_subscription_lifecycle.py

      - name: Run full test suite
        shell: pwsh
        working-directory: backend
        run: |
          python -m pytest -q

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "PrimeERP Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/commerce/accounting_service.py backend/app/modules/commerce/router.py backend/app/modules/commerce/sales_return_service.py backend/app/modules/inventory/stock_moves/service.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: repair commerce accounting contracts and lifecycle"
            git push origin HEAD:feature/product-completion-final-tax2
          } else {
            Write-Host "No source changes to commit."
          }
