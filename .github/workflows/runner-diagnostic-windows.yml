name: PrimeERP Windows Runner Diagnostic

on:
  push:
    branches:
      - 'feature/product-completion-final-tax2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    name: Windows runner startup diagnostic
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Runner identity
        shell: pwsh
        run: |
          Write-Host "runner.name=$env:RUNNER_NAME"
          Write-Host "runner.os=$env:RUNNER_OS"
          Write-Host "runner.arch=$env:RUNNER_ARCH"
          Write-Host "runner.temp=$env:RUNNER_TEMP"
      - name: Basic environment
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          python --version
          node --version
          docker --version
      - name: GitHub context
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          Write-Host "sha=$env:SHA"
          Write-Host "ref=$env:REF"
          Write-Host "event=$env:EVENT"
