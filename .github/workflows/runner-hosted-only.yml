name: PrimeERP Hosted Only Diagnostic
on:
  push:
    paths:
      - '.github/workflows/runner-hosted-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner execution
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "HOSTED_RUNNER_EXECUTED=PASS"
