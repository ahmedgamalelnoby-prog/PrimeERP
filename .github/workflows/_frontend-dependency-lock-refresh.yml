name: _frontend-dependency-lock-refresh

on:
  push:
    branches:
      - repair/module-entitlement-architecture-20260917

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/repair/module-entitlement-architecture-20260917'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile from declared dependency roots
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify clean dependency graph
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Persist lockfile and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/_frontend-dependency-lock-refresh.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No lockfile changes detected."
            exit 0
          }
          git commit -m "chore(frontend): regenerate dependency lockfile after security upgrades"
          git push origin HEAD:repair/module-entitlement-architecture-20260917
