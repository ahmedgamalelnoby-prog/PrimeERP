name: PrimeERP Runtime Release Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/runtime-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primeerp-runtime-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-release-gate:
    name: Isolated production runtime validation
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker version
          docker compose version
          docker info

      - name: Prepare isolated runtime environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pgPassword = [guid]::NewGuid().ToString('N')
          $secretKey = ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N'))
          @(
            'POSTGRES_DB=primeerp_runtime_ci'
            'POSTGRES_USER=primeerp'
            "POSTGRES_PASSWORD=$pgPassword"
            "SECRET_KEY=$secretKey"
            'CORS_ORIGINS=http://127.0.0.1:3001'
            'APP_ENV=production'
            'DEBUG=false'
            'ETA_ENABLED=false'
            'WHATSAPP_ENABLED=false'
          ) | Set-Content -Encoding utf8 .env
          @(
            'services:'
            '  db:'
            '    container_name: null'
            '  migrate:'
            '    container_name: null'
            '  backend:'
            '    container_name: null'
            '    ports:'
            '      - "8002:8001"'
            '  backend-test:'
            '    container_name: null'
            '  report-worker:'
            '    container_name: null'
            '  frontend:'
            '    container_name: null'
            '    ports:'
            '      - "3001:80"'
          ) | Set-Content -Encoding utf8 ci-runtime-compose.yml

      - name: Validate Compose
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml config

      - name: Build runtime images
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml build --pull migrate backend backend-test report-worker frontend

      - name: Start database and migrations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml up -d db migrate
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $migrateId = docker compose -f docker-compose.yml -f ci-runtime-compose.yml ps -aq migrate
            if ($migrateId) {
              $status = docker inspect -f '{{.State.Status}}' $migrateId 2>$null
              if ($status -eq 'exited') {
                $code = docker inspect -f '{{.State.ExitCode}}' $migrateId
                if ($code -eq '0') { Write-Host 'Migrations: PASS'; exit 0 }
                docker compose -f docker-compose.yml -f ci-runtime-compose.yml logs migrate
                throw "Migration failed with exit code $code"
              }
            }
            Start-Sleep -Seconds 4
          }
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml logs migrate
          throw 'Migration did not finish.'

      - name: Start production runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml up -d backend frontend report-worker

      - name: Wait for runtime containers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $backendId = docker compose -f docker-compose.yml -f ci-runtime-compose.yml ps -q backend
            $frontendId = docker compose -f docker-compose.yml -f ci-runtime-compose.yml ps -q frontend
            $workerId = docker compose -f docker-compose.yml -f ci-runtime-compose.yml ps -q report-worker
            if ($backendId -and $frontendId -and $workerId) {
              $backend = docker inspect -f '{{.State.Health.Status}}' $backendId 2>$null
              $frontend = docker inspect -f '{{.State.Status}}' $frontendId 2>$null
              $worker = docker inspect -f '{{.State.Status}}' $workerId 2>$null
              if ($backend -eq 'healthy' -and $frontend -eq 'running' -and $worker -eq 'running') {
                Write-Host 'Runtime containers: PASS'
                exit 0
              }
            }
            Start-Sleep -Seconds 5
          }
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml ps
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml logs --tail=200 db migrate backend frontend report-worker
          throw 'Runtime containers did not reach expected state.'

      - name: Validate backend readiness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8002/ready -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Backend readiness returned $($response.StatusCode)" }
          Write-Host 'Backend /ready: PASS'

      - name: Validate frontend HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/ -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Frontend returned $($response.StatusCode)" }
          if ($response.Content -notmatch '<html') { throw 'Frontend response is not HTML.' }
          Write-Host 'Frontend HTTP: PASS'

      - name: Validate backend OpenAPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8002/openapi.json -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "OpenAPI returned $($response.StatusCode)" }
          $body = $response.Content | ConvertFrom-Json
          if (-not $body.openapi) { throw 'OpenAPI document is invalid.' }
          Write-Host "OpenAPI: $($body.openapi)"

      - name: Validate frontend API proxy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/api/v1/openapi.json -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Frontend API proxy returned $($response.StatusCode)" }
          Write-Host 'Frontend -> backend proxy: PASS'

      - name: Capture runtime evidence
        if: always()
        shell: powershell
        run: |
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml ps
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml logs --tail=200 backend frontend report-worker

      - name: Cleanup
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $env:COMPOSE_PROJECT_NAME = 'primeerp-runtime-ci'
          docker compose -f docker-compose.yml -f ci-runtime-compose.yml down -v --remove-orphans 2>&1 | Out-Null
          Remove-Item .env,ci-runtime-compose.yml -Force -ErrorAction SilentlyContinue
