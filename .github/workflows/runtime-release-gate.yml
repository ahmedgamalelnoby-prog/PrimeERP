name: PrimeERP Runtime Release Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/runtime-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primeerp-runtime-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-release-gate:
    name: Isolated production runtime validation
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker version
          docker compose version
          docker info

      - name: Prepare isolated runtime environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pgPassword = [guid]::NewGuid().ToString('N')
          $secretKey = ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N'))
          @(
            'POSTGRES_DB=primeerp_runtime_ci'
            'POSTGRES_USER=primeerp'
            "POSTGRES_PASSWORD=$pgPassword"
            "SECRET_KEY=$secretKey"
            'CORS_ORIGINS=http://127.0.0.1:3000'
            'APP_ENV=production'
            'DEBUG=false'
            'ETA_ENABLED=false'
            'WHATSAPP_ENABLED=false'
          ) | Set-Content -Encoding utf8 .env

      - name: Validate Compose
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose config

      - name: Build runtime images
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose build --pull migrate backend backend-test report-worker frontend

      - name: Start database and migrations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d db migrate
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $status = docker inspect -f '{{.State.Status}}' primeerp-migrate 2>$null
            if ($status -eq 'exited') {
              $code = docker inspect -f '{{.State.ExitCode}}' primeerp-migrate
              if ($code -eq '0') { exit 0 }
              docker compose logs migrate
              throw "Migration failed with exit code $code"
            }
            Start-Sleep -Seconds 4
          }
          docker compose logs migrate
          throw 'Migration did not finish.'

      - name: Start production runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d backend frontend report-worker

      - name: Wait for backend and frontend
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $backend = docker inspect -f '{{.State.Health.Status}}' primeerp-backend 2>$null
            $frontend = docker inspect -f '{{.State.Status}}' primeerp-frontend 2>$null
            $worker = docker inspect -f '{{.State.Status}}' primeerp-report-worker 2>$null
            if ($backend -eq 'healthy' -and $frontend -eq 'running' -and $worker -eq 'running') {
              Write-Host 'Container runtime state: PASS'
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          docker compose ps
          docker compose logs --tail=200 backend frontend report-worker
          throw 'Runtime containers did not reach the expected state.'

      - name: Validate backend readiness endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8001/ready -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Backend readiness returned $($response.StatusCode)" }
          Write-Host 'Backend /ready: PASS'

      - name: Validate frontend HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/ -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Frontend returned $($response.StatusCode)" }
          if ($response.Content -notmatch '<html') { throw 'Frontend response does not contain HTML.' }
          Write-Host 'Frontend HTTP: PASS'

      - name: Validate backend API routing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8001/openapi.json -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "OpenAPI returned $($response.StatusCode)" }
          $body = $response.Content | ConvertFrom-Json
          if (-not $body.openapi) { throw 'OpenAPI document is missing the openapi field.' }
          Write-Host "OpenAPI: $($body.openapi)"

      - name: Validate frontend to backend proxy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/api/v1/openapi.json -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Frontend API proxy returned $($response.StatusCode)" }
          Write-Host 'Frontend -> backend proxy: PASS'

      - name: Capture runtime evidence
        if: always()
        shell: powershell
        run: |
          docker compose ps
          docker compose logs --tail=200 backend frontend report-worker

      - name: Cleanup
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          docker compose down -v --remove-orphans 2>&1 | Out-Null
          Remove-Item .env -Force -ErrorAction SilentlyContinue
