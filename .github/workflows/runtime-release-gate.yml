name: PrimeERP Runtime Release Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/runtime-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primeerp-runtime-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-release-gate:
    name: Isolated production runtime validation
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker version
          docker compose version
          docker info

      - name: Prepare isolated runtime environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pgPassword = [guid]::NewGuid().ToString('N')
          $secretKey = ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N'))
          @(
            'POSTGRES_DB=primeerp_runtime_ci'
            'POSTGRES_USER=primeerp'
            "POSTGRES_PASSWORD=$pgPassword"
            "SECRET_KEY=$secretKey"
            'CORS_ORIGINS=http://localhost:3000'
            'APP_ENV=production'
            'DEBUG=false'
            'ETA_ENABLED=false'
            'WHATSAPP_ENABLED=false'
          ) | Set-Content -Encoding utf8 .env

      - name: Validate Compose
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose config

      - name: Build runtime images
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose build --pull migrate backend backend-test report-worker frontend

      - name: Start PostgreSQL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d db
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $status = docker inspect -f '{{.State.Health.Status}}' primeerp-db 2>$null
            if ($status -eq 'healthy') { exit 0 }
            Start-Sleep -Seconds 3
          }
          docker compose logs db
          throw 'PostgreSQL did not become healthy.'

      - name: Apply production migrations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose run --rm migrate

      - name: Start production runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d backend frontend report-worker

      - name: Verify runtime container states
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $backend = docker inspect -f '{{.State.Health.Status}}' primeerp-backend 2>$null
            $frontend = docker inspect -f '{{.State.Health.Status}}' primeerp-frontend 2>$null
            $worker = docker inspect -f '{{.State.Status}}' primeerp-report-worker 2>$null
            if ($backend -eq 'healthy' -and $frontend -eq 'healthy' -and $worker -eq 'running') {
              Write-Host 'Backend health: PASS'
              Write-Host 'Frontend health: PASS'
              Write-Host 'Report worker state: PASS'
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          docker compose ps
          docker compose logs --tail=250 db migrate backend frontend report-worker
          throw 'Production runtime containers did not reach the expected state.'

      - name: Verify backend readiness and liveness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ready = docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=4).read().decode())"
          if ($ready -notmatch '"status":s*"ready"') { throw 'Backend readiness contract failed.' }
          $health = docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).read().decode())"
          if ($health -notmatch '"status":s*"healthy"') { throw 'Backend liveness contract failed.' }
          Write-Host 'Backend readiness/liveness: PASS'

      - name: Verify module registry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8001/modules', timeout=4).read().decode())"
          if ($modules -notmatch '"count"') { throw 'Module inventory contract failed.' }
          Write-Host 'Module registry: PASS'

      - name: Verify frontend HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/ -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Frontend returned $($response.StatusCode)" }
          if ($response.Content -notmatch '<html') { throw 'Frontend did not return HTML.' }
          Write-Host 'Frontend HTTP: PASS'

      - name: Verify runtime service graph
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $services = docker compose config --services
          foreach ($service in @('db','migrate','backend','backend-test','report-worker','frontend')) {
            if ($services -notcontains $service) { throw "Missing service: $service" }
          }
          Write-Host 'Runtime service graph: PASS'

      - name: Capture runtime diagnostics
        if: failure()
        shell: powershell
        run: |
          docker compose ps
          docker compose logs --tail=250 db migrate backend frontend report-worker

      - name: Cleanup
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { docker compose down -v --remove-orphans 2>&1 | Out-Null } catch { Write-Warning $_ }
          Remove-Item .env -Force -ErrorAction SilentlyContinue
