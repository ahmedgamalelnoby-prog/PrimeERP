name: PrimeERP Runner Trigger Diagnostic
on:
  push:
    paths:
      - '.github/workflows/runner-trigger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    steps:
      - run: echo HOSTED_RUNNER_EXECUTED
  windows:
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    steps:
      - shell: powershell
        run: Write-Host WINDOWS_RUNNER_EXECUTED
