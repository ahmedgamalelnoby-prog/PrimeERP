name: PrimeERP Runner Comparison

on:
  push:
    paths:
      - '.github/workflows/runner-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted:
    name: Hosted
    runs-on: ubuntu-latest
    steps:
      - run: echo "HOSTED_RUNNER=EXECUTED"
  windows:
    name: Windows self-hosted
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    steps:
      - shell: powershell
        run: Write-Host 'WINDOWS_SELF_HOSTED_RUNNER=EXECUTED'
