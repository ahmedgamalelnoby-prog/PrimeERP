name: Identity and company access CI

on:
  push:
    branches:
      - feat/identity-company-access-20261103
  pull_request:
    branches:
      - feature/odoo-sap-gap-audit-20261024
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/identity-company-access-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax and identity authorization tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./primeerp_ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Validate Alembic migration graph
        run: alembic heads
      - name: Test tenant and company access boundaries
        run: pytest -q tests/test_user_company_access.py tests/test_tenant_context.py tests/test_company_access_router_guards.py tests/test_report_worker.py tests/test_salla_public_app_security.py

  frontend:
    name: Frontend typecheck, build and auth tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test
