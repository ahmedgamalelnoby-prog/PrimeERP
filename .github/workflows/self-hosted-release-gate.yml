name: PrimeERP Self-Hosted Release Gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

# One Windows runner is the canonical CI executor. If another commit arrives
# while validation is running, the older run is obsolete and is cancelled.
concurrency:
  group: primeerp-self-hosted-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-and-docker:
    name: Windows self-hosted runner + Docker release validation
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 45
    steps:
      - name: Verify runner identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "GITHUB_RUN_ID=$env:GITHUB_RUN_ID"
          hostname
          whoami
          $PSVersionTable

      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize self-hosted tool PATH
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'C:\Program Files\nodejs',
            'C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin'
          )
          $pythonRoots = @(
            'C:\Users\Admin\AppData\Local\Programs\Python',
            'C:\Program Files\Python'
          )
          foreach ($root in $pythonRoots) {
            if (Test-Path $root) {
              $pythonDir = Get-ChildItem -Path $root -Directory | Sort-Object Name -Descending | Select-Object -First 1
              if ($pythonDir) {
                $paths += $pythonDir.FullName
                $paths += (Join-Path $pythonDir.FullName 'Scripts')
              }
            }
          }
          $existing = ($env:PATH -split ';') | Where-Object { $_ -and $_.Trim() }
          foreach ($path in $paths) {
            if ((Test-Path $path) -and ($existing -notcontains $path)) {
              $path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added tool path: $path"
            }
          }

      - name: Verify Git Python Node Docker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          python --version
          node --version
          npm --version
          docker version
          docker compose version

      - name: Verify Docker engine
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker info
          docker run --rm hello-world

      - name: Prepare CI environment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $pgPassword = [guid]::NewGuid().ToString('N')
          $secretKey = ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N'))
          @(
            'POSTGRES_DB=primeerp_ci'
            'POSTGRES_USER=primeerp'
            "POSTGRES_PASSWORD=$pgPassword"
            "SECRET_KEY=$secretKey"
            'CORS_ORIGINS=https://erp.example.com'
            'APP_ENV=production'
            'DEBUG=false'
            'ETA_ENABLED=false'
            'WHATSAPP_ENABLED=false'
            'FRONTEND_HOST_PORT=3001'
          ) | Set-Content -Encoding utf8 .env
          "PRIMEERP_CI_POSTGRES_PASSWORD=$pgPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRIMEERP_CI_SECRET_KEY=$secretKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRONTEND_HOST_PORT=3001" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Backend compile and architecture checks
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q app
          python scripts/check_modular_architecture.py
          python scripts/check_api_security.py
          python scripts/check_production_config.py
          python scripts/check_release_readiness.py
          python scripts/check_alembic_graph.py
          python scripts/check_product_architecture.py
          python scripts/check_frontend_backend_alignment.py

      - name: Backend environment diagnostics
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -c "import sys,platform; print('Python executable:', sys.executable); print('Python implementation:', platform.python_implementation()); print('Platform:', platform.platform()); print('Architecture:', platform.architecture()[0])"
          python -m pip --version
          python -m pip list --format=columns

      - name: Backend dependency install
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip --disable-pip-version-check --no-input 2>&1 | Tee-Object pip-upgrade.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "pip upgrade failed with exit code $code" }
          python -m pip install -r requirements.txt --disable-pip-version-check --no-input 2>&1 | Tee-Object requirements-install.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "requirements installation failed with exit code $code" }
          python -m pip install pytest --disable-pip-version-check --no-input 2>&1 | Tee-Object pytest-install.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "pytest installation failed with exit code $code" }
          python -m pip check 2>&1 | Tee-Object pip-check.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "pip check failed with exit code $code" }

      - name: Backend unit tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -vv --tb=long --maxfail=20 --junitxml=pytest-junit.xml 2>&1 | Tee-Object pytest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "pytest failed with exit code $code" }

      - name: Salla and shipping contract tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q tests/integrations/test_salla_public_app_contract.py tests/integrations/test_salla_erp_state_machine.py tests/integrations/test_salla_webhook_security.py tests/shipping

      - name: Backend diagnostics after failure
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -File -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content -Path $_.FullName -ErrorAction SilentlyContinue
          }
          if (Test-Path pytest-junit.xml) { Get-Content pytest-junit.xml }
          python -m pip list --format=freeze 2>&1

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primeerp-backend-test-diagnostics-${{ github.run_id }}
          path: |
            backend/*.log
            backend/pytest-junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Alembic graph and import smoke
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/smoke_import.py
          python -m alembic heads | Tee-Object alembic-heads.txt
          $headCount = (Select-String -Path alembic-heads.txt -Pattern '\(head\)' -AllMatches).Matches.Count
          if ($headCount -ne 1) { throw "Expected exactly one Alembic head; found $headCount" }

      - name: Frontend install and build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Validate Compose configuration
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose config

      - name: Build production images
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose build --pull migrate backend backend-test report-worker frontend


      - name: Reclaim PrimeERP Docker resources
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'

          # Reclaim only PrimeERP-owned containers/resources left by an interrupted CI run.
          docker compose down -v --remove-orphans

          $staleContainers = @(
            'primeerp-db',
            'primeerp-migrate',
            'primeerp-backend',
            'primeerp-backend-test',
            'primeerp-report-worker',
            'primeerp-frontend'
          )

          foreach ($container in $staleContainers) {
            docker rm -f $container 2>$null
          }

          Write-Host 'PrimeERP Docker resources reclaimed.'

      - name: Check frontend host port
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          FRONTEND_HOST_PORT: "3001"
        run: |
          $ErrorActionPreference = 'Stop'

          $listeners = Get-NetTCPConnection -LocalPort ([int]$env:FRONTEND_HOST_PORT) -State Listen -ErrorAction SilentlyContinue

          if ($listeners) {
            $details = @()
            foreach ($listener in $listeners) {
              $process = Get-Process -Id $listener.OwningProcess -ErrorAction SilentlyContinue
              $name = if ($process) { $process.ProcessName } else { 'unknown' }
              $details += "PID $($listener.OwningProcess): $name"
            }
            $details | ForEach-Object { Write-Host $_ }
            throw "Frontend host port $env:FRONTEND_HOST_PORT is already in use on the self-hosted runner."
          }

          Write-Host "Frontend host port $env:FRONTEND_HOST_PORT is available."

      - name: Start database and run migrations
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d db migrate
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $status = docker inspect -f '{{.State.Status}}' primeerp-migrate 2>$null
            if ($status -eq 'exited') {
              $code = docker inspect -f '{{.State.ExitCode}}' primeerp-migrate
              if ($code -eq '0') { Write-Host 'Alembic migration: PASS'; exit 0 }
              docker compose logs migrate
              throw "Migration container exited with code $code"
            }
            Start-Sleep -Seconds 5
          }
          docker compose logs migrate
          throw 'Migration container did not finish within 10 minutes.'

      - name: Execute PostgreSQL effective-date guard tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose run --rm backend-test python -m pytest -q tests/jurisdiction/test_effective_date_db_guard.py

      - name: Start backend frontend and report worker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d backend frontend report-worker

      - name: Validate runtime health
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          FRONTEND_HOST_PORT: "3001"
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $backendStatus = docker inspect -f '{{.State.Health.Status}}' primeerp-backend 2>$null
            $frontendStatus = docker inspect -f '{{.State.Health.Status}}' primeerp-frontend 2>$null
            $workerStatus = docker inspect -f '{{.State.Status}}' primeerp-report-worker 2>$null
            if ($backendStatus -eq 'healthy' -and $frontendStatus -eq 'healthy' -and $workerStatus -eq 'running') {
              Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:FRONTEND_HOST_PORT/" | Out-Null
              Write-Host 'Runtime health: PASS'
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          docker compose ps
          docker compose logs --tail=200 db migrate backend frontend report-worker
          throw 'Backend/frontend/report-worker runtime health check failed.'

      - name: Cleanup
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker compose down -v --remove-orphans
