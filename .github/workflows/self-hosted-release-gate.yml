name: PrimeERP Self-Hosted Release Gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: write

concurrency:
  group: primeerp-self-hosted-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-and-docker:
    name: Windows self-hosted runner + Docker release validation
    runs-on: [self-hosted, Windows, X64, PrimeERP]
    timeout-minutes: 45
    steps:
      - name: Verify runner identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "GITHUB_RUN_ID=$env:GITHUB_RUN_ID"
          hostname
          whoami
          $PSVersionTable

      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize self-hosted tool PATH
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('C:\Program Files\nodejs','C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin')
          $pythonRoots = @('C:\Users\Admin\AppData\Local\Programs\Python','C:\Program Files\Python')
          foreach ($root in $pythonRoots) {
            if (Test-Path $root) {
              $pythonDir = Get-ChildItem -Path $root -Directory | Sort-Object Name -Descending | Select-Object -First 1
              if ($pythonDir) { $paths += $pythonDir.FullName; $paths += (Join-Path $pythonDir.FullName 'Scripts') }
            }
          }
          $existing = ($env:PATH -split ';') | Where-Object { $_ -and $_.Trim() }
          foreach ($path in $paths) {
            if ((Test-Path $path) -and ($existing -notcontains $path)) { $path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }

      - name: Verify Git Python Node Docker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          git --version; python --version; node --version; npm --version; docker version; docker compose version

      - name: Verify Docker engine
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker info
          docker run --rm hello-world

      - name: Prepare CI environment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $pgPassword = [guid]::NewGuid().ToString('N')
          $secretKey = ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N'))
          $composeProject = "primeerp-ci-$env:GITHUB_RUN_ID"
          "::add-mask::$pgPassword"
          "::add-mask::$secretKey"
          @('POSTGRES_DB=primeerp_ci','POSTGRES_USER=primeerp',"POSTGRES_PASSWORD=$pgPassword","SECRET_KEY=$secretKey",'CORS_ORIGINS=https://erp.example.com','APP_ENV=production','DEBUG=false','ETA_ENABLED=false','WHATSAPP_ENABLED=false','PRIMEERP_FRONTEND_PORT=3100',"COMPOSE_PROJECT_NAME=$composeProject") | Set-Content -Encoding utf8 .env
          "COMPOSE_PROJECT_NAME=$composeProject" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PRIMEERP_FRONTEND_PORT=3100" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Backend compile and architecture checks
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q app
          python scripts/check_modular_architecture.py
          python scripts/check_api_security.py
          python scripts/check_production_config.py
          python scripts/check_release_readiness.py
          python scripts/check_alembic_graph.py

      - name: Backend environment diagnostics
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -c "import sys,platform; print('Python executable:', sys.executable); print('Python implementation:', platform.python_implementation()); print('Platform:', platform.platform()); print('Architecture:', platform.architecture()[0])"
          python -m pip --version
          python -m pip list --format=columns

      - name: Backend dependency install
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip --disable-pip-version-check --no-input 2>&1 | Tee-Object pip-upgrade.log
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
          python -m pip install -r requirements.txt --disable-pip-version-check --no-input 2>&1 | Tee-Object requirements-install.log
          if ($LASTEXITCODE -ne 0) { throw "requirements installation failed with exit code $LASTEXITCODE" }
          python -m pip install pytest --disable-pip-version-check --no-input 2>&1 | Tee-Object pytest-install.log
          if ($LASTEXITCODE -ne 0) { throw "pytest installation failed with exit code $LASTEXITCODE" }
          python -m pip check 2>&1 | Tee-Object pip-check.log
          if ($LASTEXITCODE -ne 0) { throw "pip check failed with exit code $LASTEXITCODE" }

      - name: Backend unit tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -vv --tb=long --maxfail=20 --junitxml=pytest-junit.xml 2>&1 | Tee-Object pytest.log
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }

      - name: Backend diagnostics after failure
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -File -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_.FullName -ErrorAction SilentlyContinue }
          if (Test-Path pytest-junit.xml) { Get-Content pytest-junit.xml }
          python -m pip list --format=freeze 2>&1

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primeerp-backend-test-diagnostics-${{ github.run_id }}
          path: |
            backend/*.log
            backend/pytest-junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Alembic graph and import smoke
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./primeerp_ci_smoke.db
          APP_ENV: test
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/smoke_import.py
          python -m alembic heads | Tee-Object alembic-heads.txt
          $headCount = (Select-String -Path alembic-heads.txt -Pattern '\(head\)' -AllMatches).Matches.Count
          if ($headCount -ne 1) { throw "Expected exactly one Alembic head; found $headCount" }

      - name: Frontend dependency graph refresh
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --package-lock-only --ignore-scripts --no-audit
          if ($LASTEXITCODE -ne 0) { throw "npm package-lock refresh failed with exit code $LASTEXITCODE" }

          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          if (git status --short -- package-lock.json) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(frontend): persist resolved secure dependency graph"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
          }

          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { throw "npm audit failed with exit code $LASTEXITCODE" }

      - name: Frontend install and build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit
          if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit code $LASTEXITCODE" }

      - name: Frontend dependency security audit
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Continue'
          npm audit --json *> npm-audit.json
          $auditExit = $LASTEXITCODE
          if (Test-Path npm-audit.json) {
            try {
              $audit = Get-Content npm-audit.json -Raw | ConvertFrom-Json
              if ($audit.metadata.vulnerabilities) {
                $v = $audit.metadata.vulnerabilities
                Write-Host "npm audit summary: info=$($v.info) low=$($v.low) moderate=$($v.moderate) high=$($v.high) critical=$($v.critical)"
              }
            } catch {
              Write-Host 'npm audit JSON could not be parsed; raw artifact will be retained.'
            }
          }
          if ($auditExit -ne 0) { Write-Host "npm audit reported vulnerabilities (exit code $auditExit); continuing for diagnostic collection." }

      - name: Upload frontend dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primeerp-frontend-npm-audit-${{ github.run_id }}
          path: |
            frontend/npm-audit.json
            frontend/package-lock.json
          if-no-files-found: warn
          retention-days: 7

      - name: Frontend typecheck lint build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: frontend
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run typecheck
          npm run lint
          npm run build

      - name: Validate Compose configuration
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose config

      - name: Build production images
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose build --pull migrate backend backend-test report-worker frontend

      - name: Start database and run migrations
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d db migrate
          $migrateId = docker compose ps -q migrate
          if (-not $migrateId) { throw 'Migration container was not created.' }
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $status = docker inspect -f '{{.State.Status}}' $migrateId 2>$null
            if ($status -eq 'exited') {
              $code = docker inspect -f '{{.State.ExitCode}}' $migrateId
              if ($code -eq '0') { Write-Host 'Alembic migration: PASS'; exit 0 }
              docker compose logs migrate
              throw "Migration container exited with code $code"
            }
            Start-Sleep -Seconds 5
          }
          docker compose logs migrate
          throw 'Migration container did not finish within 10 minutes.'

      - name: Audit module entitlement and plan relationships
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose run --rm backend-test python scripts/check_module_entitlement_contract.py

      - name: Execute PostgreSQL effective-date guard tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose run --rm backend-test python -m pytest -q tests/jurisdiction/test_effective_date_db_guard.py

      - name: Start backend frontend and report worker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d backend frontend report-worker

      - name: Validate runtime health
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $backendId = docker compose ps -q backend
          $frontendId = docker compose ps -q frontend
          $workerId = docker compose ps -q report-worker
          if (-not $backendId -or -not $frontendId -or -not $workerId) { throw 'Runtime containers were not created.' }
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $backendStatus = docker inspect -f '{{.State.Health.Status}}' $backendId 2>$null
            $workerStatus = docker inspect -f '{{.State.Status}}' $workerId 2>$null
            if ($backendStatus -eq 'healthy' -and $workerStatus -eq 'running') {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3100/ | Out-Null
              Write-Host "Backend health: $backendStatus"
              Write-Host "Worker status: $workerStatus"
              Write-Host 'Runtime health: PASS'
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          docker compose ps
          docker compose logs --tail=200 db migrate backend frontend report-worker
          throw 'Backend/frontend/report-worker runtime health check failed.'

      - name: Cleanup
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: docker compose down -v --remove-orphans
