name: PrimeERP Docker CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: primeerp-ci
  DOCKER_CLI_PATH: 'C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin'

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& {0}"

jobs:
  docker:
    name: Docker Build, Migration & Runtime Validation
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Docker
        run: |
          if (-not (Test-Path "$env:DOCKER_CLI_PATH\docker.exe")) {
            throw "Docker CLI not found at $env:DOCKER_CLI_PATH\docker.exe"
          }
          $env:Path = "$env:DOCKER_CLI_PATH;$env:Path"
          & "$env:DOCKER_CLI_PATH\docker.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Docker CLI is installed but Docker Desktop/engine is unavailable" }
          "$env:DOCKER_CLI_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare Docker environment
        run: Copy-Item .env.docker.example .env.docker -Force
      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker config -q
      - name: Build backend image
        run: docker build --pull -t primeerp-backend:ci ./backend
      - name: Validate backend image Python sources
        run: docker run --rm primeerp-backend:ci python -m compileall -q app
      - name: Build frontend image
        run: docker build --pull -t primeerp-frontend:ci ./frontend
      - name: Start full Docker stack
        run: |
          docker compose --env-file .env.docker up -d --build
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed" }
      - name: Wait for database, migration and backend health
        run: |
          $deadline = (Get-Date).AddMinutes(8)
          $backendHealthy = $false
          while ((Get-Date) -lt $deadline) {
            $db = docker inspect --format '{{.State.Health.Status}}' primeerp-db 2>$null
            $migration = docker inspect --format '{{.State.Status}}' primeerp-migrate 2>$null
            $backend = docker inspect --format '{{.State.Health.Status}}' primeerp-backend 2>$null
            Write-Host "db=$db migration=$migration backend=$backend"
            if ($migration -eq 'exited') {
              $migrationExit = docker inspect --format '{{.State.ExitCode}}' primeerp-migrate 2>$null
              if ($migrationExit -ne '0') {
                docker compose --env-file .env.docker logs migrate
                throw "Database migration failed with exit code $migrationExit"
              }
            }
            if ($backend -eq 'healthy') { $backendHealthy = $true; break }
            if ($backend -eq 'unhealthy') {
              docker compose --env-file .env.docker logs --tail=200 backend
              throw "Backend container became unhealthy"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $backendHealthy) {
            docker compose --env-file .env.docker ps
            docker compose --env-file .env.docker logs --tail=200 db migrate backend
            throw "Backend did not become healthy within 8 minutes"
          }
      - name: Runtime API smoke test
        run: |
          $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8001/ready' -TimeoutSec 15
          if ($response.StatusCode -ne 200) { throw "Backend /ready returned HTTP $($response.StatusCode)" }
          Write-Host $response.Content
      - name: Runtime frontend smoke test
        run: |
          $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/' -TimeoutSec 15
          if ($response.StatusCode -ne 200) { throw "Frontend returned HTTP $($response.StatusCode)" }
          if ([string]::IsNullOrWhiteSpace($response.Content)) { throw "Frontend returned an empty response" }
          Write-Host "Frontend HTTP $($response.StatusCode), response length=$($response.Content.Length)"
      - name: Docker runtime diagnostics
        if: always()
        run: |
          $env:Path = "$env:DOCKER_CLI_PATH;$env:Path"
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=100 migrate
          docker compose --env-file .env.docker logs --tail=100 backend
      - name: Cleanup Docker stack
        if: always()
        run: |
          $env:Path = "$env:DOCKER_CLI_PATH;$env:Path"
          docker compose --env-file .env.docker down -v --remove-orphans
          docker image rm primeerp-backend:ci primeerp-frontend:ci 2>$null
