name: PrimeERP Docker Validation

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: primeerp-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: primeerp-ci

jobs:
  docker:
    name: Docker Build, Migration & Runtime Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker runtime
        run: |
          docker version
          docker compose version

      - name: Prepare Docker environment
        run: cp .env.docker.example .env.docker

      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker config -q

      - name: Build backend image
        run: docker build --pull -t primeerp-backend:ci ./backend

      - name: Validate backend image Python sources
        run: docker run --rm primeerp-backend:ci python -m compileall -q app

      - name: Build frontend image
        run: docker build --pull -t primeerp-frontend:ci ./frontend

      - name: Start full Docker stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Wait for database, migration and application health
        run: |
          set -euo pipefail
          for _ in $(seq 1 48); do
            db=$(docker inspect --format '{{.State.Health.Status}}' primeerp-db 2>/dev/null || true)
            migration=$(docker inspect --format '{{.State.Status}}' primeerp-migrate 2>/dev/null || true)
            backend=$(docker inspect --format '{{.State.Health.Status}}' primeerp-backend 2>/dev/null || true)
            frontend=$(docker inspect --format '{{.State.Health.Status}}' primeerp-frontend 2>/dev/null || true)
            echo "db=$db migration=$migration backend=$backend frontend=$frontend"
            if [[ "$migration" == "exited" ]]; then
              code=$(docker inspect --format '{{.State.ExitCode}}' primeerp-migrate)
              if [[ "$code" != "0" ]]; then
                docker compose --env-file .env.docker logs migrate
                exit 1
              fi
            fi
            if [[ "$backend" == "unhealthy" || "$frontend" == "unhealthy" ]]; then
              docker compose --env-file .env.docker logs --tail=200 backend frontend
              exit 1
            fi
            if [[ "$backend" == "healthy" && "$frontend" == "healthy" && "$migration" == "exited" ]]; then
              code=$(docker inspect --format '{{.State.ExitCode}}' primeerp-migrate)
              [[ "$code" == "0" ]] && exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=200 db migrate backend frontend
          exit 1

      - name: Runtime API readiness smoke test
        run: docker exec primeerp-backend python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=15); assert r.status == 200; print(r.read().decode())"

      - name: Runtime API contract smoke test
        run: |
          docker exec primeerp-backend python - <<'PY'
          import json
          import urllib.request

          spec = json.load(
              urllib.request.urlopen(
                  'http://127.0.0.1:8001/api/v1/openapi.json', timeout=15
              )
          )
          paths = spec.get('paths', {})
          required = [
              '/api/v1/identity/login',
              '/api/v1/identity/me',
              '/api/v1/platform/tenants',
              '/api/v1/subscriptions/tenant/{tenant_id}',
              '/api/v1/accounting/tax-rates',
              '/api/v1/taxes/rates',
              '/api/v1/uom',
              '/api/v1/inventory/items',
              '/api/v1/inventory/items/{item_id}/stock',
              '/api/v1/catalog/categories',
              '/api/v1/catalog/price-lists',
              '/api/v1/catalog/prices',
              '/api/v1/catalog/recipes',
              '/api/v1/catalog/menus',
              '/api/v1/catalog/products/{product_id}/pricing-analysis',
              '/api/v1/integrations/connections',
              '/api/v1/shipping/carriers',
          ]
          missing = [path for path in required if path not in paths]
          assert not missing, f'Missing required API routes: {missing}'
          print(f'Runtime OpenAPI contract passed: {len(paths)} paths registered')
          PY

      - name: Runtime frontend smoke test
        run: curl -fsS http://127.0.0.1:3000/ >/dev/null

      - name: Runtime frontend API proxy smoke test
        run: |
          status=$(curl -s -o /tmp/api-response.txt -w '%{http_code}' http://127.0.0.1:3000/api/v1/identity/me)
          test "$status" = "401"
          grep -Eq 'detail|Not authenticated' /tmp/api-response.txt

      - name: Migration idempotency check
        run: docker compose --env-file .env.docker run --rm migrate

      - name: Docker runtime diagnostics
        if: always()
        run: |
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=100 migrate
          docker compose --env-file .env.docker logs --tail=100 backend
          docker compose --env-file .env.docker logs --tail=100 frontend

      - name: Cleanup Docker stack
        if: always()
        run: |
          docker compose --env-file .env.docker down -v --remove-orphans >/dev/null 2>&1 || true
          docker image rm primeerp-backend:ci primeerp-frontend:ci >/dev/null 2>&1 || true
