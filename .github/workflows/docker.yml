name: PrimeERP Docker CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: primeerp-ci

jobs:
  docker:
    name: Docker Build, Migration & Runtime Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker runtime
        run: |
          docker version
          docker compose version

      - name: Prepare Docker environment
        run: cp .env.docker.example .env.docker

      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker config -q

      - name: Build backend image
        run: docker build --pull -t primeerp-backend:ci ./backend

      - name: Validate backend image Python sources
        run: docker run --rm primeerp-backend:ci python -m compileall -q app

      - name: Build frontend image
        run: docker build --pull -t primeerp-frontend:ci ./frontend

      - name: Start full Docker stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Wait for database, migration and backend health
        run: |
          for n in $(seq 1 48); do
            db=$(docker inspect --format '{{.State.Health.Status}}' primeerp-db 2>/dev/null || true)
            migration=$(docker inspect --format '{{.State.Status}}' primeerp-migrate 2>/dev/null || true)
            backend=$(docker inspect --format '{{.State.Health.Status}}' primeerp-backend 2>/dev/null || true)
            echo "db=$db migration=$migration backend=$backend"
            if [ "$migration" = "exited" ]; then
              migration_exit=$(docker inspect --format '{{.State.ExitCode}}' primeerp-migrate)
              if [ "$migration_exit" != "0" ]; then
                docker compose --env-file .env.docker logs migrate
                exit 1
              fi
            fi
            if [ "$backend" = "unhealthy" ]; then
              docker compose --env-file .env.docker logs --tail=200 backend
              exit 1
            fi
            if [ "$backend" = "healthy" ]; then
              echo 'Backend is healthy and migrations completed.'
              exit 0
            fi
            sleep 10
          done
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=200 db migrate backend
          exit 1

      - name: Runtime API readiness smoke test
        run: docker exec primeerp-backend python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=15); assert r.status == 200; print(r.read().decode())"

      - name: Runtime API contract smoke test
        run: docker exec primeerp-backend python -c "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/v1/openapi.json',timeout=15)); p=s.get('paths',{}); required=['/api/v1/identity/login','/api/v1/identity/me','/api/v1/companies','/api/v1/tenants','/api/v1/subscriptions/tenant/{tenant_id}','/api/v1/inventory/items','/api/v1/inventory/items/{item_id}/stock']; missing=[x for x in required if x not in p]; assert not missing, f'Missing required API routes: {missing}'; assert 'post' in p['/api/v1/identity/login']; assert 'get' in p['/api/v1/companies']; assert 'get' in p['/api/v1/inventory/items']; assert 'get' in p['/api/v1/inventory/items/{item_id}/stock']; print(f'Runtime OpenAPI contract passed: {len(p)} paths registered')"

      - name: Runtime frontend smoke test
        run: curl -fsS http://127.0.0.1:3000/ >/dev/null

      - name: Docker runtime diagnostics
        if: always()
        run: |
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=100 migrate
          docker compose --env-file .env.docker logs --tail=100 backend

      - name: Cleanup Docker stack
        if: always()
        run: |
          docker compose --env-file .env.docker down -v --remove-orphans
          docker image rm primeerp-backend:ci primeerp-frontend:ci >/dev/null 2>&1 || true
