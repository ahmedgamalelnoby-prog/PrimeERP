name: PrimeERP Docker CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: primeerp-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: primeerp-ci
  DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

jobs:
  docker:
    name: Docker Build, Migration & Runtime Validation
    runs-on: [self-hosted, PrimeERP]
    timeout-minutes: 40
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Docker CLI
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'primeerp-docker-cli'
          $bin = Join-Path $root 'bin'
          $config = Join-Path $root 'config'
          $plugins = Join-Path $config 'cli-plugins'
          New-Item -ItemType Directory -Force -Path $bin, $plugins | Out-Null
          $dockerExe = Join-Path $bin 'docker.exe'
          if (-not (Test-Path $dockerExe)) {
            $known = @('C:\Users\Admin\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe','C:\Program Files\Docker\Docker\resources\bin\docker.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($known) {
              Copy-Item $known $dockerExe -Force
            } else {
              $headers = @{ 'User-Agent' = 'PrimeERP-CI' }
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/docker/cli/releases/latest' -Headers $headers
              $asset = $release.assets | Where-Object { $_.name -match '^docker-.*\.zip$' } | Select-Object -First 1
              if (-not $asset) { throw 'Official Docker CLI Windows asset not found.' }
              $zip = Join-Path $root 'docker-cli.zip'
              Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
              $extract = Join-Path $root 'extract'
              if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
              Expand-Archive -Path $zip -DestinationPath $extract -Force
              $candidate = Get-ChildItem $extract -Filter docker.exe -Recurse | Select-Object -First 1
              if (-not $candidate) { throw 'Docker CLI archive did not contain docker.exe.' }
              Copy-Item $candidate.FullName $dockerExe -Force
            }
          }
          $composeExe = Join-Path $plugins 'docker-compose.exe'
          if (-not (Test-Path $composeExe)) {
            $headers = @{ 'User-Agent' = 'PrimeERP-CI' }
            $composeRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/docker/compose/releases/latest' -Headers $headers
            $composeAsset = $composeRelease.assets | Where-Object { $_.name -eq 'docker-compose-windows-x86_64.exe' } | Select-Object -First 1
            if (-not $composeAsset) { throw 'Official Docker Compose Windows asset not found.' }
            Invoke-WebRequest -UseBasicParsing -Uri $composeAsset.browser_download_url -Headers $headers -OutFile $composeExe
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOCKER_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOCKER_HOST=npipe:////./pipe/dockerDesktopLinuxEngine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH = "$bin;$env:PATH"
          $env:DOCKER_CONFIG = $config
          $env:DOCKER_HOST = 'npipe:////./pipe/dockerDesktopLinuxEngine'
          & $dockerExe version
          if ($LASTEXITCODE -ne 0) { throw 'Docker CLI cannot connect to Docker Desktop Linux engine.' }
          & $dockerExe compose version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose plugin is not usable.' }

      - name: Prepare Docker environment
        run: copy /Y .env.docker.example .env.docker

      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker config -q

      - name: Build backend image
        run: docker build --pull -t primeerp-backend:ci ./backend

      - name: Validate backend image Python sources
        run: docker run --rm primeerp-backend:ci python -m compileall -q app

      - name: Build frontend image
        run: docker build --pull -t primeerp-frontend:ci ./frontend

      - name: Start full Docker stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Wait for database, migration and backend health
        run: |
          set "HEALTHY=0"
          for /L %%N in (1,1,48) do (
            for /F "delims=" %%A in ('docker inspect --format "{{.State.Health.Status}}" primeerp-db 2^>NUL') do set "DB=%%A"
            for /F "delims=" %%A in ('docker inspect --format "{{.State.Status}}" primeerp-migrate 2^>NUL') do set "MIGRATION=%%A"
            for /F "delims=" %%A in ('docker inspect --format "{{.State.Health.Status}}" primeerp-backend 2^>NUL') do set "BACKEND=%%A"
            echo db=%DB% migration=%MIGRATION% backend=%BACKEND%
            if /I "%BACKEND%"=="healthy" set "HEALTHY=1"
            if /I "%MIGRATION%"=="exited" (
              for /F "delims=" %%A in ('docker inspect --format "{{.State.ExitCode}}" primeerp-migrate 2^>NUL') do set "MIGRATION_EXIT=%%A"
              if not "%MIGRATION_EXIT%"=="0" (
                docker compose --env-file .env.docker logs migrate
                exit /b 1
              )
            )
            if /I "%BACKEND%"=="unhealthy" (
              docker compose --env-file .env.docker logs --tail=200 backend
              exit /b 1
            )
            if "%HEALTHY%"=="1" goto :backend_ready
            timeout /t 10 /nobreak >NUL
          )
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=200 db migrate backend
          exit /b 1
          :backend_ready
          echo Backend is healthy and migrations completed.

      - name: Runtime API readiness smoke test
        run: docker exec primeerp-backend python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=15); assert r.status == 200; print(r.read().decode())"

      - name: Runtime API contract smoke test
        run: docker exec primeerp-backend python -c "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/v1/openapi.json',timeout=15)); p=s.get('paths',{}); required=['/api/v1/identity/login','/api/v1/identity/me','/api/v1/companies','/api/v1/tenants','/api/v1/subscriptions/tenant/{tenant_id}','/api/v1/inventory/items','/api/v1/inventory/items/{item_id}/stock']; missing=[x for x in required if x not in p]; assert not missing, f'Missing required API routes: {missing}'; assert 'post' in p['/api/v1/identity/login']; assert 'get' in p['/api/v1/companies']; assert 'get' in p['/api/v1/inventory/items']; assert 'get' in p['/api/v1/inventory/items/{item_id}/stock']; print(f'Runtime OpenAPI contract passed: {len(p)} paths registered')"

      - name: Runtime frontend smoke test
        run: curl.exe -fsS http://127.0.0.1:3000/ >NUL

      - name: Docker runtime diagnostics
        if: always()
        run: |
          docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker logs --tail=100 migrate
          docker compose --env-file .env.docker logs --tail=100 backend

      - name: Cleanup Docker stack
        if: always()
        run: |
          docker compose --env-file .env.docker down -v --remove-orphans >NUL 2>&1
          docker image rm primeerp-backend:ci primeerp-frontend:ci >NUL 2>&1
          exit /b 0
